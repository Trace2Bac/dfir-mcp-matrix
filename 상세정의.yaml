        포함: "호출 인자로 받은 완료 표시·확인 값을 조건으로 삼아 호출을 막는다."
        제외: "서버가 그 표시를 앞선 호출의 상태와 대조하면 B04.01~03이다. 모델이 값을 채우므로 선행 작업을 확인한 것으로 세지 않는다."

