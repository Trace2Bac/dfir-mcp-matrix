  B04:
    축: B
    이름: "선행 상태에 따른 실행 제어 방식"
    질문: "앞선 작업·검증·기록 상태로 호출 허용을 어떻게 결정하는가?"
    미구현: "앞선 호출이 만든 상태를 조건으로 호출을 막는 코드가 없다. 서버 지침·도구 설명으로 순서를 안내만 하는 경우도 여기에 둔다."
    비적용: "없음. 모든 서버에 적용한다."
    예외: "조건 검사를 거치지 않는 도구·인자·모드·설정이 있거나 검사 중 오류가 나면 통과시키면 †를 붙인다."
    상세:
