        이름: "메모리 상태·능력 집합 대조"
        포함: "앞선 호출이 서버 프로세스 메모리에 남긴 결과(보유 능력·적재한 입력)를 호출 조건과 대조해 채우지 않은 호출을 거부한다."
        제외: "조건 선언만 있거나 상태를 보여 주기만 하는 경우는 제외한다. 조건이 조사 단계 값이면 B04.03이다."
      - id: B04.02
        이름: "호출 기록·DB 상태 대조"
        포함: "호출 기록이나 사건 DB에 남은 앞선 호출·등록 내용을 읽어 호출 조건과 대조하고 채우지 않은 호출을 거부한다."
        제외: "기록을 남기기만 하고 호출 허용에 쓰지 않으면 제외한다. 조건이 조사 단계 값이면 B04.03이다."
