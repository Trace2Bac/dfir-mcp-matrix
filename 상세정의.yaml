# 셀을 판정한 표본. 보고서가 없는 표본은 모든 시범 셀에서 `미확인`으로 보인다.
표본: [ChainsawMCP, mcp_dfir, regipy, agentic-velociraptor-mcp, MyIRTeam, mulder, trudi, sift-kernel]

# 모든 셀에 공통인 항목의 뜻. 셀마다 `미구현`·`비적용` 뜻을 더 좁혀 적는다.
공통:
  미구현: "셀의 어느 구현 방식에도 들지 않는다."
  비적용: "셀이 전제로 하는 일을 서버가 하지 않는다."
  미확인: "이 셀의 새 정의로 아직 조사하지 않았다."
  예외표시: "†는 그 방식이 모든 도구·인자·모드에 걸리지 않거나 예외 경로가 있다는 표시다. 보고서 절의 범위·예외 단락에 적는다."

