        이름: "단계 전이 조건 검사"
        포함: "서버가 조사 단계를 두고 지금 단계에서 허용하지 않는 호출이나 조건을 채우지 않은 단계 전이를 거부한다."
        제외: "단계를 안내하거나 보여 주기만 하면 A03·A04에서 본다."
