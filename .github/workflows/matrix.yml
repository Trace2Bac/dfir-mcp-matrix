# 원본(matrix/·reports/)을 검사하고 화면을 빌드한다.
# - PR·main 푸시마다: validate(스키마·파일 일관성) → build → 빌드한 화면을 아티팩트 "matrix-site"로 올린다.
#   Actions 실행 화면 아래 Artifacts에서 내려받아 압축을 풀고 그 폴더에서 `python -m http.server`로 본다.
# - GitHub Pages 배포는 저장소 변수 PAGES_ENABLED가 'true'일 때만 한다.
#   비공개 저장소는 유료 플랜이어야 Pages를 쓸 수 있다. 공개로 바꾸거나 플랜을 올린 뒤
#   Settings → Pages → Source를 "GitHub Actions"로 두고 Settings → Variables에 PAGES_ENABLED=true를 만든다.
# - 원고의 코드 발췌 대조(check)는 옛 저장소와 서버 클론이 있어야 해서 여기서는 돌리지 않는다.
name: matrix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: validate
        run: python tools/pilot.py validate
      - name: build matrix data
        run: python tools/pilot.py build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install docusaurus
        working-directory: ./web
        run: npm ci
      - name: copy matrix data to web
        run: |
          mkdir -p web/static/data
          cp _site/data/matrix.json web/static/data/matrix.json
      - name: build docusaurus
        working-directory: ./web
        run: npm run build
      - name: 화면 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: matrix-site
          path: web/build
          retention-days: 14
      - name: Pages 아티팩트
        if: github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    if: github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
