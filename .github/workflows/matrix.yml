# 버전 태그(v<매트릭스 버전 날짜>, 예: v2026-10-06)를 올릴 때만 돈다. PR과 main 푸시에서는 돌지 않는다.
# - validate(스키마·파일 일관성) → Docusaurus 빌드(web/) → 빌드한 사이트를 아티팩트 "matrix-site"로 올린다.
#   사이트는 baseUrl(/dfir-mcp-architecture-matrix-v2/) 기준이라 아티팩트를 폴더째 열면 경로가 맞지 않는다. 로컬에서는 web/에서 npm start로 본다.
# - 빌드가 끝나면 GitHub Pages(https://trace2bac.github.io/dfir-mcp-architecture-matrix-v2/)에 배포한다.
#   태그의 날짜는 matrix/config.yaml의 version과 같아야 한다. 같은 날 다시 배포하면 v2026-10-06.2처럼 뒤에 번호를 붙인다(결정 0041).
#   Settings → Pages → Source가 "GitHub Actions"여야 하고, Settings → Environments → github-pages의
#   "Deployment branches and tags"에 태그 규칙 v*가 있어야 한다.
# - 원고의 코드 발췌 대조(check)는 서버 클론이 있어야 해서 여기서는 돌리지 않는다.
name: matrix

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# 배포가 겹치면 앞 배포를 끝까지 두고 뒤 배포를 기다리게 한다
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 버전 태그와 매트릭스 버전 대조
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import yaml; print(yaml.safe_load(open('matrix/config.yaml'))['version'])")
          if [ "${tag%%.*}" != "$version" ] || ! echo "$tag" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$'; then
            echo "태그 ${GITHUB_REF_NAME}가 matrix/config.yaml의 version(${version})과 맞지 않는다. 태그는 v${version} 또는 v${version}.<번호>여야 한다."
            exit 1
          fi
      - name: validate
        run: python tools/pilot.py validate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install docusaurus
        working-directory: ./web
        run: npm ci
      - name: build docusaurus
        working-directory: ./web
        run: npm run build      # 플러그인(web/plugins/matrix-data.ts)이 pilot.py build로 화면 데이터를 만든다
      - name: 화면 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: matrix-site
          path: web/build
          retention-days: 14
      - name: Pages 아티팩트
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
