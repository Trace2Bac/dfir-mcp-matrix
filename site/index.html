<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFIR MCP Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EFF2F3; --surface:#FFFFFF; --surface-2:#F6F8F9;
  --ink:#12202B; --muted:#5A6B78; --faint:#8494A0;
  --line:#D3DCE1; --line-soft:#E4EAED;
  --accent:#0E6A68; --accent-ink:#FFFFFF;
  --hi:#FFF6DC; --hi-line:#DFB53B;
  --warn:#8A4B12; --warn-soft:#FBEEDD;
  --code-bg:#F3F6F7; --spec:#EDEFF0;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101619; --surface:#182126; --surface-2:#1E282E;
  --ink:#E6EDF0; --muted:#9BACB6; --faint:#71848F;
  --line:#2A363D; --line-soft:#222D33; --accent:#4FB3AF; --accent-ink:#0C1417;
  --hi:#38311A; --hi-line:#8A742A; --warn:#E2A56B; --warn-soft:#3A2A1A;
  --code-bg:#141C20; --spec:#151C21;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101619; --surface:#182126; --surface-2:#1E282E;
  --ink:#E6EDF0; --muted:#9BACB6; --faint:#71848F;
  --line:#2A363D; --line-soft:#222D33; --accent:#4FB3AF; --accent-ink:#0C1417;
  --hi:#38311A; --hi-line:#8A742A; --warn:#E2A56B; --warn-soft:#3A2A1A;
  --code-bg:#141C20; --spec:#151C21;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Malgun Gothic",sans-serif;
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0}
.wrap{padding-inline:20px;padding-block:28px 56px;max-width:1360px;margin:0 auto}
h1{font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(24px,4vw,32px);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:78ch}
button{font:inherit}
.kicker{font-family:Archivo,sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}

/* 전체 셀 구조 */
.scroll{overflow-x:auto;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(8,minmax(148px,1fr));gap:7px;align-items:start;min-width:1220px}
.col{display:flex;flex-direction:column;gap:5px}
.colhead{padding:7px 9px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px}
.colhead .ax{font-family:Archivo,sans-serif;font-weight:700;font-size:15px}
.colhead .nm{font-size:11.5px;color:var(--muted);display:block;line-height:1.35}
.tile{position:relative;text-align:left;cursor:pointer;width:100%;padding:6px 8px 6px 11px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:2px;color:var(--ink)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 2px;background:var(--line)}
.tile.studied::before{background:var(--accent)}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible,.chip:focus-visible,.deft:focus-visible,.mk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile[aria-pressed="true"]{background:var(--hi);border-color:var(--hi-line)}
.tile .id{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
.tile .cond{font-size:10px;color:var(--faint);border:1px dashed var(--line);border-radius:2px;padding:0 4px;margin-left:4px}
.tile .t{display:block;font-size:12.5px;font-weight:600;line-height:1.3;margin-top:1px}
.tile .st{display:block;font-size:11px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
.tile.studied .st{color:var(--accent);font-weight:600}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--faint);margin-top:6px}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--line)}
.key i.s{background:var(--accent)}

/* 셀 설명 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px 18px;margin-top:18px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.pid{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent)}
.panel h2{font-family:Archivo,sans-serif;font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.deft{cursor:pointer;font-size:12.5px;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:1px 10px}
.deft[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.q{margin:6px 0 2px;color:var(--muted)}
.meta{margin:0;color:var(--faint);font-size:12.5px}
.state{margin:8px 0 0;font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:2px;padding:5px 9px;display:inline-block}
.note{margin:8px 0 0;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:2px;padding:6px 9px}
.rows{margin-top:12px}
.row{display:grid;grid-template-columns:minmax(0,17em) minmax(0,1fr);gap:4px 14px;padding:8px 0;border-top:1px solid var(--line-soft)}
@media (max-width:600px){.row{grid-template-columns:minmax(0,1fr)}}
.row .nm{font-size:13.5px;font-weight:600;line-height:1.35}
.row .iid{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11.5px;color:var(--faint);margin-right:6px}
.row .def{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
.row .def span{display:block}
.row .def b{font-weight:600;color:var(--ink)}
.row.sp{background:var(--spec)}
.row.sp .nm,.row.sp .chips{padding-inline:7px}
.row.sp .nm{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{cursor:pointer;font-size:12.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:1px 8px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi-line)}
.chip.un{cursor:default;border-style:dashed;color:var(--faint);background:transparent}
.row.cand .nm{color:var(--faint);font-weight:500}
.row.cand .iid{opacity:.7}
.none{font-size:12px;color:var(--faint)}

/* 구현 보기 */
.impl h3{font-family:Archivo,sans-serif;font-size:18px;font-weight:600;margin:2px 0 0;text-wrap:balance}
.dag{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 8px}
.part{margin-top:14px}
.part > .lab{font-family:Archivo,sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.part.exc{border-left:3px solid var(--warn);padding-left:12px}
.part.exc > .lab{color:var(--warn)}
.part p{margin:0 0 10px}
.ev{border-top:1px solid var(--line-soft);padding:8px 0 4px;font-size:13px;color:var(--muted)}
.ev p{margin:0 0 6px}
.ev.flash{background:var(--hi)}
.evn{font-family:"IBM Plex Mono",monospace;color:var(--ink);margin-right:6px;float:left}
.impl code{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--code-bg);border-radius:2px;padding:0 3px}
pre.code{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:3px;padding:10px 12px;overflow-x:auto;margin:4px 0 6px;font-size:12px;line-height:1.5;clear:both}
pre.code code{background:none;padding:0;font-size:inherit;white-space:pre}
.impl a{color:var(--accent)}
a.mk{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:.85em}
.sub,.q,.note,.row .nm,.part p,.ev p,.impl h3,.panel h2{overflow-wrap:anywhere}
.foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);max-width:90ch;overflow-wrap:anywhere}
</style>

<div class="wrap">
  <h1 data-t="title"></h1>
  <p class="sub" data-t="intro"></p>

  <p class="kicker" data-t="gridTitle"></p>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="key"><span><i class="s"></i><span data-t="keyStudied"></span></span><span><i></i><span data-t="keyUnstudied"></span></span><span data-t="keyCond"></span></div>

  <section class="panel" id="cell" aria-live="polite"></section>
  <section class="panel impl" id="impl" hidden aria-live="polite"></section>

  <p class="foot" id="foot"></p>
</div>

<!-- 화면 틀이다. 데이터는 tools/pilot.py build가 matrix/·reports/에서 만들어 _site/data/matrix.json에 둔다.
     로컬에서는 python tools/pilot.py serve로 띄워 본다(파일을 더블클릭으로 열면 브라우저가 JSON 읽기를 막는다). -->
<script>
// ── 화면 문구 ── 화면에 보이는 낱말은 모두 여기에 둔다. 다국어로 나눌 때 언어별 표를 더하고 LANG만 고른다.
// special의 세 값은 data/matrix.json의 값과 같아야 한다(tools/pilot.py의 TERMS).
const STRINGS = {
  ko: {
    title: '시범 전환 매트릭스',
    intro: '셀을 누르면 아래에 상세 항목(구현 방식)과 그 방식을 쓰는 MCP 서버가 열린다. 서버를 누르면 그 서버의 구현·예외·근거가 열린다. †는 예외가 있는 구현이다.',
    gridTitle: '전체 셀 구조',
    keyStudied: '새 정의로 조사한 서버가 있는 셀',
    keyUnstudied: '아직 조사하지 않은 셀',
    keyCond: '조건부: 지원 기능이 있는 서버에만 적용',
    loadFail: why => 'data/matrix.json을 읽지 못했다(' + why + '). 저장소에서 python tools/pilot.py serve로 띄운다.',
    foot: (cells, servers) => '시범 범위: ' + cells.join('·') + ' ' + cells.length + '개 셀과 ' + servers.join('·') + ' ' + servers.length +
      '개 서버. 셀 구조와 정의는 저장소의 matrix/cells/, 서버 원고는 reports/에 있다. 새 정의로 원고를 쓰지 않은 서버는 그 셀에서 미확인에 둔다.',
    special: ['미구현', '비적용', '미확인'],
    cond: '조건부',
    studied: (n, total) => '조사 ' + n + '/' + total,
    unstudied: '미조사',
    showDefs: '상세 항목 정의 보기',
    hideDefs: '정의 숨기기',
    condScope: '조건부 셀 · 적용 대상: ',
    stateUndefined: '정의 전 · 미조사: 상세 항목 이름만 정했고 포함·제외 기준과 서버 조사는 아직 없다.',
    stateUnstudied: '미조사: 상세 항목 정의는 있지만 새 정의로 조사한 서버가 없다.',
    scopeNote: '적용 범위(†의 기준): ',
    boundaryNote: '다른 셀과의 경계: ',
    include: '포함 ',
    exclude: '제외 ',
    candidate: '구현 사례 없음 · 후보',
    noServer: '해당 서버 없음',
    notStudiedTitle: '새 정의로 아직 조사하지 않았다',
    seen: ' · 원고 전',
    seenTitle: '구현을 확인했지만 이 셀의 원고를 아직 쓰지 않았다(matrix/cells의 seen_in)',
    hasException: '† 예외 있음',
    judge: '판단',
    impl: '구현',
    exc: '예외',
    evidence: '근거',
  },
};
const LANG = 'ko';
const T = STRINGS[LANG];
document.documentElement.lang = LANG;
document.title = T.title;
document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
function fail(why){
  document.body.textContent = T.loadFail(why);
}
fetch('data/matrix.json')
  .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(start)
  .catch(e => fail(e.message));

function start(D){
document.getElementById('foot').textContent = T.foot(D.pilot.cells, D.pilot.servers);
const SPECIAL = T.special;
const byId = Object.fromEntries(D.cells.map(c => [c.id, c]));
let cur = null, curImpl = null, showDefs = false;
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

function drawGrid(){
  const g = document.getElementById('grid'); g.innerHTML = '';
  for(const ax of Object.keys(D.axes)){
    const col = el('div', 'col');
    const h = el('div', 'colhead'); h.append(el('span', 'ax', ax), el('span', 'nm', D.axes[ax])); col.append(h);
    for(const c of D.cells.filter(x => x.axis === ax)){
      const b = el('button', 'tile' + (c.studied ? ' studied' : ''));
      b.setAttribute('aria-pressed', cur === c.id ? 'true' : 'false');
      const top = el('span'); top.append(el('span', 'id', c.id)); if(c.cond) top.append(el('span', 'cond', T.cond));
      b.append(top, el('span', 't', c.name), el('span', 'st', c.studied ? T.studied(c.studied, D.samples.length) : T.unstudied));
      b.onclick = () => { openCell(c.id); document.getElementById('cell').scrollIntoView({block:'start', behavior:'smooth'}); };
      col.append(b);
    }
    g.append(col);
  }
}

function openCell(id, keepImpl){
  cur = id; if(!keepImpl){ curImpl = null; document.getElementById('impl').hidden = true; }
  const c = byId[id], p = document.getElementById('cell'); p.innerHTML = '';
  const ph = el('div', 'ph');
  ph.append(el('span', 'pid', c.id), el('h2', null, c.name));
  const t = el('button', 'deft', showDefs ? T.hideDefs : T.showDefs);
  t.setAttribute('aria-pressed', showDefs); t.onclick = () => { showDefs = !showDefs; openCell(id, true); };
  ph.append(t); p.append(ph, el('p', 'q', c.q));
  if(c.cond) p.append(el('p', 'meta', T.condScope + c.scope));
  if(!c.defined) p.append(el('p', 'state', T.stateUndefined));
  else if(!c.studied) p.append(el('p', 'state', T.stateUnstudied));
  if(showDefs){
    if(c.dscope) p.append(el('p', 'note', T.scopeNote + c.dscope));
    if(c.note) p.append(el('p', 'note', T.boundaryNote + c.note));
  }
  const rows = el('div', 'rows');
  for(const r of c.rows){
    const sp = SPECIAL.includes(r.id);
    const row = el('div', 'row' + (sp ? ' sp' : '') + (r.cand ? ' cand' : ''));
    const nm = el('div', 'nm');
    if(!sp) nm.append(el('span', 'iid', r.id));
    nm.append(document.createTextNode(r.name));
    if(showDefs && (r.inc || r.exc)){
      const d = el('span', 'def');
      if(r.inc){ const x = el('span'); if(!sp) x.append(el('b', null, T.include)); x.append(document.createTextNode(r.inc)); d.append(x); }
      if(r.exc){ const x = el('span'); x.append(el('b', null, T.exclude), document.createTextNode(r.exc)); d.append(x); }
      nm.append(d);
    }
    const chips = el('div', 'chips');
    if(r.cand) chips.append(el('span', 'none', T.candidate));
    else if(!r.m.length && !(r.seen || []).length) chips.append(el('span', 'none', T.noServer));
    for(const m of r.m){
      const key = c.id + '|' + m.s + '|' + r.id;
      const has = key in D.impl;
      const b = el('button', 'chip' + (has ? '' : ' un'), m.s + (m.d ? ' †' : ''));
      b.setAttribute('aria-pressed', curImpl === key ? 'true' : 'false');
      if(has) b.onclick = () => openImpl(c.id, m.s, r.id, m.d);
      else { b.disabled = true; b.title = T.notStudiedTitle; }
      chips.append(b);
    }
    for(const sv of r.seen || []){
      const b = el('span', 'chip un seen', sv + T.seen);
      b.title = T.seenTitle;
      chips.append(b);
    }
    row.append(nm, chips); rows.append(row);
  }
  p.append(rows);
  drawGrid();
}

function openImpl(cid, s, iid, dag, noScroll){
  curImpl = cid + '|' + s + '|' + iid;
  const d = D.impl[curImpl], c = byId[cid], r = c.rows.find(x => x.id === iid);
  const p = document.getElementById('impl'); p.innerHTML = ''; p.hidden = false;
  const ph = el('div', 'ph'); ph.append(el('span', 'pid', cid + ' · ' + s));
  const h = el('div', 'ph'); h.append(el('h3', null, SPECIAL.includes(iid) ? iid : iid + ' ' + r.name));
  if(dag) h.append(el('span', 'dag', T.hasException));
  p.append(ph, h);
  const part = (cls, lab, htmlText) => { const x = el('div', 'part ' + cls); x.append(el('p', 'lab', lab)); const b = el('div'); b.innerHTML = htmlText; x.append(b); p.append(x); };
  part('imp', SPECIAL.includes(iid) ? T.judge : T.impl, d.impl);
  if(d.exc) part('exc', T.exc, d.exc);
  part('evd', T.evidence, d.evid);
  p.querySelectorAll('a.mk').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const t = p.querySelector('#EV-' + a.dataset.ev);
    if(t){ t.scrollIntoView({block:'center', behavior:'smooth'}); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1400); }
  });
  openCell(cid, true);
  if(!noScroll) p.scrollIntoView({block:'start', behavior:'smooth'});
}

// 주소 끝 #셀 또는 #셀--서버--상세 로 바로 연다 (예: #E03, #T03--trudi--T03.02)
(function(){
  const h = decodeURIComponent(location.hash.slice(1)).split('--');
  const first = D.cells.find(c => c.studied) || D.cells[0];
  if(h[0] && byId[h[0]]){
    openCell(h[0]);
    if(h.length === 3){ const key = h[0] + '|' + h[1] + '|' + h[2];
      if(key in D.impl){ const r = byId[h[0]].rows.find(x => x.id === h[2]); const m = r && r.m.find(x => x.s === h[1]); openImpl(h[0], h[1], h[2], m && m.d, true); } }
  } else openCell(first.id);
})();
}
</script>
