# D02 파생물 계보
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: D02
name: 파생물 계보
question: 소비한 입력·실행과 생성 결과를 어떻게 연결하는가?
conditional: false
boundary: 응답 항목의 출처 표시와 재조회는 R05
scope: 서버가 남기는 파생물(보관한 도구 출력, 파일로 남는 파생물, 발견사항, 보고 산출물)과 그것을 만든 실행·소비한 입력 사이의 연결이다. 상세마다 그 연결이 걸린다고 구현에 적은 파생물이 적용 범위다. 그 범위 안에서 참조가 빠지거나, 검사 없이 바뀌거나, 다시 실행하거나 덮어쓴 뒤 다른 대상을 가리키게 되는 경로가 있으면 †를 붙인다. 연결이 없는 다른 파생물은 †가 아니라 구현에 적는다.
not_implemented: 파생물을 남기지만 그것을 만든 실행이나 소비한 입력을 가리키는 값이 파생물에도 서버 기록에도 없다.
not_applicable: 서버가 파생물을 남기지 않는다(D01 미구현).
details:
- id: D02.01
  name: 증거·호출·파생물 ID 참조
  include: 파생물이나 그 기록에 그것을 만든 호출의 ID, 소비한 증거·중간 입력·다른 파생물의 ID나 경로를 남긴다.
  exclude: 해시로 내용을 잇는 것은 D02.02다. 응답 항목마다 출처를 표시하는 것은 R05다. 어느 방향의 참조가 있는지는 구현에 적는다.
- id: D02.02
  name: 입출력 해시 연결
  include: 파생물 기록에 소비한 입력의 해시와 만든 출력의 해시를 함께 남겨 내용으로 잇는다.
  exclude: 출력 해시만 있고 입력은 경로·이름으로만 가리키면 D02.01이다. 남긴 해시를 다시 대조하는 것은 D03이다.
- id: D02.03
  name: 파생물 측 manifest
  include: 파일로 남는 파생물 곁에 입력·실행·시각을 적은 manifest 파일을 둔다.
  exclude: 서버 DB나 호출 기록에만 연결이 있으면 D02.01이다.
- id: D02.04
  name: 양방향 조회
  include: 파생물에서 그것을 만든 호출·입력을, 호출·입력에서 그것이 만든 파생물을 모두 찾는 조회 도구·명령이 있다.
  exclude: 한 방향의 참조 필드만 있으면 D02.01이다. 정의만 있고 도구·명령에서 부르지 않는 함수는 세지 않는다.
- id: D02.05
  name: 중간 입력 버전·부모 관계
  include: 앞 도구의 파생물을 뒤 도구가 입력으로 쓸 때 그 중간 입력의 버전(실행 ID·해시)과 부모 관계를 기록한다.
  exclude: 최종 파생물에서 원본 증거만 가리키면 D02.01이다.
