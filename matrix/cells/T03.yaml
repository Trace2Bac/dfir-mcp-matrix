# T03 실행 조건 확인
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: T03
name: 실행 조건 확인
question: 인자 밖의 조건(앞선 작업·판정 상태, 모델 밖 승인자의 승인, 원격 호출자의 신원, 서버의 실행 자원 상태)으로 호출을 허용할지와 언제 실행할지를 어떻게 정하는가?
conditional: false
scope: 인자 밖의 조건(앞선 호출이 만든 상태, 모델 밖 승인자의 승인, 원격 호출자의 신원, 서버의 실행 자원 상태)을 걸어 둔 호출이다. 도구 명세·설명이 선행 조건이나 승인을 적은 호출도 든다. 그런 호출이 검사를 거치지 않는 도구·인자·모드·설정이 있거나, 검사 중 오류가 나면 통과시키거나, 조건이 실제 사실과 다르게 채워지면 †를 붙인다.
not_implemented: 인자 밖의 조건으로 호출을 막거나 미루는 코드가 없다. 서버 지침·도구 설명으로 순서나 승인을 안내만 하는 경우와 도구 annotation만 있는 경우도 여기에 둔다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: T03.01
  name: 선행 결과 존재 대조
  include: 앞선 호출이 만든 결과(보유 능력·적재한 입력·인용한 호출 기록·기준선 파일)가 있는지 보고 없으면 호출을 거부한다.
  exclude: 결과를 어디에 두고 얼마나 남는지는 P04에서 본다. 결과가 통과 판정인지 보면 T03.03이다.
- id: T03.02
  name: 조사 단계 검사
  include: 서버가 조사 단계를 두고 지금 단계에서 허용하지 않는 호출이나 조건을 채우지 않은 단계 전이를 거부한다.
  exclude: 단계를 안내하거나 보여 주기만 하면 P02·P03에서 본다.
- id: T03.03
  name: 앞선 점검·판정 결과 대조
  include: 앞선 점검·검토 호출이 낸 판정(보고 준비 완료, 검토 통과 등)이 통과인지 보고 통과가 아니면 호출을 거부한다.
  exclude: 판정을 내리고 심사하는 방식은 D07에서 본다.
- id: T03.04
  name: 반복 호출 제한
  include: 같은 호출이 같은 결과를 정한 횟수만큼 되풀이하면 다음 호출을 거부한다.
  exclude: 알리기만 하고 막지 않으면 제외한다.
- id: T03.05
  name: 모델이 채우는 확인 값 검사
  include: 호출 인자로 받은 완료 표시·확인 값(`confirm` 등)을 조건으로 삼아 호출을 막는다.
  exclude: 서버가 그 값을 앞선 호출의 상태와 대조하면 T03.01~03이다. 같은 요청에서 모델이 채울 수 있으므로 선행 작업 확인이나 별도 승인자의 동의로 세지 않는다.
- id: T03.06
  name: 승인 토큰·서명 대조
  include: 모델 밖의 승인자(운영자·외부 승인 경로)가 낸 토큰·서명·기록이 있는지 서버가 대조하고 없으면 호출을 거부한다.
  exclude: 모델이 같은 대화에서 만들 수 있는 값이면 T03.05다. 승인한 내용이 요청과 맞는지는 T03.07에서 본다.
- id: T03.07
  name: 승인 내용과 요청 대조
  include: 승인에 묶인 작업·대상·인자가 실제 요청과 같은지 대조하고 다르면 호출을 거부한다.
  exclude: 승인이 있는지만 보면 T03.06이다.
- id: T03.08
  name: 승인 만료·소모·재승인
  include: 승인에 유효 시간·사용 횟수를 두거나 요청이 바뀌면 승인을 다시 받게 한다.
  exclude: T03.06·T03.07이 있을 때만 연결한다.
- id: T03.09
  name: 원격 호출자 인증
  include: 원격 MCP 연결에서 서버가 프로토콜 인증·API key·서명·세션으로 호출자를 확인한다.
  exclude: stdio 서버의 프로세스 실행 권한은 프로필에서 본다. stdio 서버가 이 항목에 없는 것을 결함으로 세지 않는다. 서버가 백엔드에 접속할 때 쓰는 자격증명은 I04다.
- id: T03.10
  name: 앞단 게이트웨이 인증에 위임
  include: 서버는 호출자를 확인하지 않고 저장소가 지원하는 배포의 앞단 프록시·게이트웨이 인증에 맡긴다.
  exclude: 그런 배포 구성이 저장소에 없으면 연결하지 않는다.
- id: T03.11
  name: 실행 자원 상태 확인
  include: 실행 전에 메모리·CPU 같은 서버 자원 사용률을 확인하고 기준을 넘으면 실행을 미루거나 거부한다. 동시에 도는 실행 수를 정해 둔 개수로 제한하는 것도 여기에 둔다.
  exclude: 정해 둔 시간을 기다린 뒤 실행하는 것은 설계된 동작이라 구현에 적는다. 자원 상태를 읽지 못하면 확인 없이 통과시키거나 설정으로 끌 수 있으면 †다. 분석 도구 자체의 시간 제한은 T08.02다.
