# D05 발견사항 기록 관리
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: D05
name: 발견사항 기록 관리
question: 발견사항과 가설의 내용·판정·근거·시각·수정·철회를 어떻게 저장하는가?
conditional: false
scope: 서버가 발견사항·가설·단서 메모를 받아 남기는 도구와 저장소다. 상세마다 그 방식이 걸린다고 구현에 적은 도구가 적용 범위다. 그 범위 안에서 필드 검사를 거치지 않고 값이 바뀌거나, 참조·시각·이력이 빠지거나, 저장소와 기록이 서로 어긋나는 경로가 있으면 †를 붙인다. 근거를 서버가 심사하는 방식은 D07에서 본다.
not_implemented: 발견사항을 받는 도구는 있지만 내용을 서버에 남기지 않고 응답으로 되돌려주기만 한다.
not_applicable: 서버에 발견사항·가설을 받아 남기는 기능이 없다.
details:
- id: D05.01
  name: 자유 노트
  include: 발견사항이나 단서를 정해진 판정 필드 없이 자유 글로 남긴다(노트, 북마크 메모).
  exclude: 판정·근거 필드를 나눠 받으면 D05.02다. 보고서 본문 서술만 받으면 D08에서 본다.
- id: D05.02
  name: 발견사항 필드 구분 저장
  include: 발견사항을 제목·설명·판정(심각도·확신도 등)을 나눈 필드로 받아 남긴다. 판정 값을 검사하는지는 D05.10에서 본다.
  exclude: 근거 참조 필드는 D05.03, 시각 필드는 D05.04에서 따로 본다. 판정을 서버가 심사하는 것은 D07이다.
- id: D05.03
  name: 근거 증거·호출 참조
  include: 발견사항에 근거로 삼은 증거·호출·파생물의 ID나 이름을 필드로 남긴다.
  exclude: 그 참조가 실재하고 내용과 맞는지 심사하는 것은 D07이다. 참조를 따라 파생물 계보를 잇는 것은 D02다.
- id: D05.04
  name: 사건 시각과 작성 시각 분리
  include: 발견사항이 가리키는 사건의 시각과 발견사항을 쓴 시각을 다른 필드로 남긴다.
  exclude: 작성 시각만 있으면 연결하지 않는다.
- id: D05.05
  name: 수정·철회 이력
  include: 발견사항·가설을 고치거나 철회하거나 가설 상태가 바뀔 때 앞 값이나 바뀐 사실을 서버 저장소·기록에 남겨 바뀐 차례를 다시 볼 수 있다.
  exclude: 현재 값만 덮어쓰고 앞 값도 바뀐 사실도 남기지 않으면 연결하지 않는다.
- id: D05.06
  name: 파일·DB에 저장
  include: 발견사항을 파일이나 DB에 써서 서버를 다시 띄워도 남는다.
  exclude: 프로세스 메모리에만 두면 연결하지 않는다. 보관 위치 일반은 D01에서 본다.
- id: D05.07
  name: 가설 지지·반박 근거 연결
  include: 가설을 발견사항과 따로 두고 그것을 지지하거나 반박하는 근거(호출·발견사항)를 연결해 남긴다.
  exclude: 발견사항의 근거 참조만 있으면 D05.03이다.
- id: D05.08
  name: 가설 상태 관리
  include: 가설에 상태(열림·지지·기각 등)를 두고 서버가 정한 규칙이나 도구 호출로 상태를 바꾼다. 상태를 정하는 규칙을 구현에 적는다.
  exclude: 제목 접두어 같은 표기 규칙만 있으면 연결하지 않고 구현에 적는다. 바뀐 차례를 남기는지는 D05.05에서 본다.
- id: D05.09
  name: 미해결 반론을 보고에 전달
  include: 닫히지 않은 반론·가설을 서버가 보고 산출물에 따로 싣는다.
  exclude: 보고 산출물 구성 전반은 D08이다.
- id: D05.10
  name: 판정 값 형식 검사
  include: 심각도·확신도 같은 판정 값이 정해 둔 값 가운데 하나인지 서버가 검사하고 어긋나면 거부한다.
  exclude: 값 목록을 도구 설명·안내문에만 적고 서버가 검사하지 않으면 제외한다. 등록·수정 가운데 검사를 거치지 않고 값이 바뀌는 경로가 있으면 †다. 판정이 근거와 맞는지 심사하는 것은 D07이다.

