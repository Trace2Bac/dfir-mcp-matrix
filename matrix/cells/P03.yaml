# P03 조사 진척 판단
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: P03
name: 조사 진척 판단
question: 대상별 수행 범위와 남은 작업·완료를 어떻게 표현하고 판단하는가?
conditional: false
scope: 서버가 수행 범위·남은 작업·완료를 표현하거나 판단한다고 구현에 적은 도구와 조건이다. 판단이 대상 단위가 아니라 이름·총계로만 맞춰지거나, 실패·생략한 작업을 수행한 것으로 세거나, 생략 사유가 실제와 다르거나, 판단에 쓰는 상태가 다시 시작한 뒤 사라지면 †를 붙인다. 진척을 다루지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 서버가 무엇을 수행했고 무엇이 남았는지 표현하지 않고 완료 판단을 모델에 맡긴다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: P03.01
  name: 기준 작업 목록 대조
  include: 서버가 대상 유형마다 해야 할 작업 목록을 두고 실제 수행 기록과 대조해 수행한 작업과 남은 작업을 알린다.
  exclude: 목록을 안내만 하고 수행 기록과 대조하지 않으면 P02.01이다.
- id: P03.02
  name: 대상별 시도·성공·실패·생략 집계
  include: 서버가 대상(증거 항목·시스템)마다 시도·성공·실패·생략한 작업을 호출 기록이나 작업 상태로 세어 알린다.
  exclude: 대상 구별 없이 작업 묶음의 실행 상태만 세면 T08에서 본다. 모델이 적은 진행 기록은 P03.05다.
- id: P03.03
  name: 단계 상태·완료 조건 대조
  include: 서버가 조사 단계나 완료 조건(최소 결과 수, 필수 작업 호출, 진행 중 작업 종료 등)을 두고 지금 상태가 그 조건을 채우는지 판단해 알린다.
  exclude: 그 판단으로 호출을 막는 것은 T03에서 본다. 단계를 안내하기만 하면 P02에서 본다.
- id: P03.04
  name: 미조사 범위·생략 사유 보고
  include: 서버가 다루지 않은 대상·자료와 건너뛴 작업, 그 사유를 응답에 싣는다.
  exclude: 잘린 결과의 나머지는 R02에서 본다.
- id: P03.05
  name: 모델이 적은 진행 기록 보관
  include: 모델이 대상별로 마친 작업·다룬 질문·확인하지 못한 범위를 도구로 적으면 서버가 저장한다. 요약을 돌려주는지와 실제 호출과 대조하는지는 원고 구현에 적는다.
  exclude: 서버가 호출 기록으로 직접 센 시도·결과는 P03.02다. 범위·진행과 관계없는 조사 메모는 D05.01이다.
