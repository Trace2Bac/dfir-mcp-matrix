# D08 검토 보고 산출물 구성
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: D08
name: 검토 보고 산출물 구성
question: 검토자가 증거·범위·방법·결과·한계를 확인할 자료를 어떻게 구성하는가?
conditional: false
boundary: 봉인·서명과 재검증은 D03
scope: 서버가 검토용 보고 산출물(보고서·묶음·내보내기 파일)을 만드는 도구·경로와, 같은 저장소가 함께 내놓는 운영자 CLI·클라이언트 훅이 서버 기록을 정해진 코드로 가공해 그 산출물을 만드는 경로다. CLI·훅이 만드는 경우는 운영자가 그것을 돌려야 만들어진다는 점을 구현 첫머리에 적는다. 클라이언트 모델이 안내문에 따라 쓰는 보고서 글은 세지 않고 원고에 사실로 적는다. 그 산출물에 실린 증거·범위·근거·검증 내용이 서버가 가진 사실과 다르게 채워지거나, 설정·실패로 그 내용이 빠지는 경로가 있으면 †를 붙인다.
not_implemented: 사건 단위 자료(발견사항·호출 기록·적재 자료)는 있지만 검토용 보고 산출물을 만들거나 내보내는 도구가 없다.
not_applicable: 사건 개념도 보고·내보내기 도구도 없어 검토용 산출물을 묶을 단위가 없다.
details:
- id: D08.01
  name: 증거·환경 manifest 포함
  include: 보고 산출물에 분석한 증거 목록(경로·해시·크기)이나 분석 환경(서버·도구·모델과 그 버전)을 싣는다.
  exclude: 산출물의 봉인·서명은 D03이다. 고정 문구로 환경을 단언하기만 하면 들지 않고, 목록과 함께 실리면 그 문구가 사실과 다른지를 예외로 본다.
- id: D08.02
  name: 수행·누락 범위 포함
  include: 보고 산출물에 실제로 부른 도구·호출과 다룬 자료의 범위를 싣는다. 하지 않았거나 실패한 범위를 따로 싣는지는 원고 구현에 적는다.
  exclude: 조사 진척을 판단하는 방식은 P03이다. 호출 기록 파일의 위치만 적으면 제외한다.
- id: D08.03
  name: 발견사항과 근거 링크 포함
  include: 발견사항마다 근거 식별자(호출 ID·자료 이름)와 그 근거의 기록·원문으로 가는 연결을 싣는다.
  exclude: 근거를 심사하는 방식은 D07이다. 발견사항 본문만 싣고 근거 식별자가 없으면 제외한다.
- id: D08.04
  name: 검증·한계 포함
  include: 보고 산출물에 그 조사에서 실제로 한 검증(해시 재대조·근거 심사)의 결과와 다루지 못한 범위·해석 한계를 싣는다.
  exclude: 조사와 관계없이 늘 같은 고정 문구는 들지 않는다. 산출물 자체의 봉인·재검증은 D03이다.
- id: D08.05
  name: 내보내기
  include: 보고 산출물을 검토자가 받을 파일(문서·표준 교환 형식)로 써서 경로를 돌려주거나 내려받게 한다.
  exclude: 모델 응답으로만 돌려주고 파일로 남기지 않으면 제외한다. 같은 저장소의 운영자 CLI·클라이언트 훅이 서버 기록으로 내보내 파일을 만들면 든다(결정 0013). 클라이언트 모델이 직접 쓰는 파일은 제외한다.
