# R01 도구 출력 가공
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: R01
name: 도구 출력 가공
question: 도구 출력을 어떤 변환·추출·요약을 거쳐 응답하고, 시간값을 어떻게 변환·표현하며, 가공 사실과 변환 전 값을 어떻게 드러내는가?
conditional: false
boundary: 잘림은 R02, 증거 내용과 지시 구분은 R07
scope: 그 가공·표시·시간 처리가 걸린다고 구현에 적은 응답 경로다. 그 경로 안에서 설명과 다르게 가공하거나 가공 대상·변환 전 값·시간대를 알리는 표시가 빠지거나 실제와 다른 경우가 있으면 †를 붙인다. 그 방식을 쓰지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 쓰지 않는다. 도구 출력을 돌려주는 서버는 가공 방식 상세(R01.01~R01.04) 가운데 하나 이상에 든다. 가공 사실이나 변환 전 값을 드러내지 않는 것은 R01.05~R01.09에 연결하지 않고 구현에 적는다.
not_applicable: 서버가 도구 출력이나 그 가공 결과를 모델에게 돌려주지 않는다.
details:
- id: R01.01
  name: 가공 없이 전달
  include: 도구 출력을 서버가 바꾸지 않고 응답이나 조회 도구로 돌려준다.
  exclude: 길이·건수만 잘라 넘기는 것은 R02에서 본다. 서버가 필드를 고르거나 형식을 바꾸면 R01.02·R01.03이다.
- id: R01.02
  name: 구조화 파싱·필드 선택
  include: 도구 출력을 파싱해 필드로 나누거나 그 가운데 일부 필드·값만 골라 응답한다.
  exclude: 모델이 인자로 고른 범위·필드로 줄인 것은 가공으로 세지 않는다. 증거 내용을 서버 문구와 다른 필드에 두는 것이 지시 구분이 되는지는 R07에서 본다.
- id: R01.03
  name: 형식 변환·집계
  include: 도구 출력을 다른 형식으로 바꾸거나 여러 출력·레코드를 묶어 건수·점수·차집합·상관 같은 값을 계산해 응답한다.
  exclude: 계산한 값을 바탕으로 결론이나 공격 흐름을 서술하는 방식은 D06에서 본다.
- id: R01.04
  name: 모델 요약
  include: 서버가 모델을 불러 도구 출력을 요약하거나 해석한 글을 응답한다.
  exclude: 모델 호출의 입력·응답 기록은 L02, 모델과 그 판의 표시는 T06에서 본다.
- id: R01.05
  name: 가공 사실·대상 표시
  include: 응답이 서버가 가공한 결과라는 것과 가공에 쓴 원래 출력(source·파일·도구)을 응답에 적는다.
  exclude: 잘림 표시는 R02, 응답 항목마다 붙는 출처 식별자와 그 재조회는 R05에서 본다.
- id: R01.06
  name: 시간 변환 전 값 유지
  include: 서버가 시각을 바꾸지 않고 도구 출력의 원래 시각 표기를 그대로 전달한다.
  exclude: 바꾼 값과 원래 값을 함께 주면 R01.07이다. 원래 값이 길이 상한에서 잘리는 것은 R02에서 본다.
- id: R01.07
  name: 정규화 시간과 변환 전 값 병기
  include: 서버가 바꾼 시각과 원래 값(원래 문자열·정수·바이트)을 같은 응답 항목에 함께 싣는다.
  exclude: 원래 값을 버리고 바꾼 값만 싣는 도구는 연결하지 않고 구현에 적는다.
- id: R01.08
  name: 시간대·단위·정밀도 표시
  include: 응답의 시각 값에 시간대(UTC 표기·오프셋)·단위·정밀도를 값이나 필드 이름으로 밝힌다.
  exclude: 도구 설명에만 적고 응답 값에는 없으면 제외한다.
- id: R01.09
  name: 시간 변환·추정 사실 표시
  include: 서버가 바꾸거나 추정해 채운 시각(연도·시간대 가정 등)이라는 것을 응답의 필드·값·문구로 알린다.
  exclude: 바꾼 값을 따로 두기만 하고 무엇을 가정했는지 알리지 않으면 제외한다.
