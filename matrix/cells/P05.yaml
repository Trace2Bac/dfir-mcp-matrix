# P05 사건 자료 정리
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: P05
name: 사건 자료 정리
question: 조사를 끝내거나 다시 시작할 때 누가 어떤 기능으로 사건의 증거·호출 기록·파생물·조사 상태를 지우거나 초기화하고 그 흔적을 남기는가?
conditional: false
boundary: 확인·승인 절차는 T03, 보고 산출물 확정은 D08. 보관 기간·대상 같은 보관 정책 자체는 D01
scope: 사건 자료(증거, 호출 기록, 파생물, 조사 상태)를 지우거나 초기화하는 도구·명령·자동 처리다. 진행 중인 조사에서 발견사항·메모 한 건을 지우는 것은 D05에서 본다. 지운다고 설명한 기능이 지우지 않거나 설명과 다른 범위를 지우거나, 보호·기록 장치가 일부 경로·조건에서 빠지면 †를 붙인다.
not_implemented: 서버가 사건 자료를 남기는데 지우거나 초기화하는 기능이 없다.
not_applicable: 서버가 사건 자료를 파일·DB·메모리에 남기지 않는다.
details:
- id: P05.01
  name: 모델 도구로 삭제·초기화
  include: 모델이 부를 수 있는 도구나 인자가 사건 자료를 지우거나 초기화한다.
  exclude: 발견사항·메모 한 건의 삭제는 D05에서 본다. 승인 절차는 T03에서 본다.
- id: P05.02
  name: 운영자 명령으로만
  include: 사건 자료를 지우거나 초기화하는 기능이 모델 도구에는 없고 운영자의 명령·설정·시작 인자로만 있다.
  exclude: 모델 도구로도 할 수 있으면 P05.01이다.
- id: P05.03
  name: 자동 정리
  include: 서버가 종료·작업 완료 같은 조건에서 사건 자료나 작업 파일을 스스로 지운다.
  exclude: 보관 기간·대상을 정한 정책은 D01에서 본다. 프로세스와 함께 사라지는 메모리 상태는 P04에서 본다.
- id: P05.04
  name: 원본 증거까지 삭제 대상에 포함
  include: 삭제·초기화 기능이 원본 증거나 원본을 담은 폴더까지 지울 수 있다.
  exclude: 작업 사본만 지우면 P05.05다.
- id: P05.05
  name: 원본 증거를 삭제 대상에서 제외
  include: 삭제·초기화 대상을 서버가 만든 사건 저장소의 파일·DB나 작업 폴더로 정해 원본 증거 경로를 대상에서 뺀다.
  exclude: 원본 쓰기를 막는 장치 일반은 E03에서 본다.
- id: P05.06
  name: 삭제 전 보관
  include: 지우거나 초기화하기 전에 대상 자료를 다른 곳에 옮기거나 사본으로 남긴다.
  exclude: 보관 기간·대상의 정책은 D01에서 본다.
- id: P05.08
  name: 자료가 남은 사건의 초기화 거부
  include: 초기화 요청을 받아도 사건에 적재한 자료·기록이 있으면 지우지 않거나 요청을 거부한다.
  exclude: 승인·확인 값을 받아 허용하는 절차는 T03에서 본다. 지우기 전에 사본을 남기면 P05.06이다.
- id: P05.07
  name: 삭제 사실 기록
  include: 지운 대상·시각·주체를 호출 기록이나 별도 기록에 남기고 그 기록은 지우는 대상에서 빠진다.
  exclude: 지우는 호출의 인자만 남고 무엇을 지웠는지 남지 않으면 원고에 적는다.
