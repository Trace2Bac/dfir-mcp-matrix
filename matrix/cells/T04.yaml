# T04 실행 방식
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: T04
name: 실행 방식
question: 실제 분석을 어떤 호출 방식으로 수행하고 실행 주체·권한·작업 공간을 서버와 얼마나 분리하는가?
conditional: false
boundary: 모든 서버가 어느 실행 구성에 들므로 미구현을 두지 않고 격리가 없는 구성은 그 상세 이름으로 드러냄. 같은 권한·파일·네트워크에 닿는 별도 프로세스는 격리로 세지 않음
scope: 서버가 실제 분석(파싱·검색·외부 도구 실행·원격 작업 요청)을 수행하는 모든 경로다. 한 서버가 여러 상세에 든다. 분리 장치(T04.04~T04.07)가 걸린다고 구현에 적은 도구에서 장치 밖으로 도는 경로가 있거나 설정·인자로 장치를 끌 수 있으면 †를 붙인다. 호출 방식(T04.01~T04.03·T04.08·T04.09)은 어느 도구가 그 방식인지 구현에 적고 †로 표시하지 않는다.
not_implemented: 없음. 모든 서버가 어느 실행 방식에 든다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: T04.01
  name: 서버 프로세스 안 라이브러리 호출
  include: 분석을 서버 프로세스 안에서 라이브러리 함수로 수행한다.
  exclude: 라이브러리가 서버의 권한·메모리를 함께 쓰므로 격리로 세지 않는다. 같은 라이브러리를 별도 프로세스로 띄우면 T04.02다.
- id: T04.02
  name: 같은 권한의 별도 프로세스
  include: 외부 실행 파일을 서버와 같은 계정·파일·네트워크 권한의 자식 프로세스로 인자 목록을 넘겨 실행한다.
  exclude: 셸 명령 문자열이면 T04.03이다. 서버째 컨테이너에서 돌더라도 도구가 서버와 같은 컨테이너·계정이면 여기에 둔다.
- id: T04.03
  name: 셸 명령 문자열 실행
  include: 셸이 해석하는 명령 문자열(`shell=True`, `sh -c` 등)로 외부 도구를 실행한다.
  exclude: 모델 값이 그 문자열에 들어가는지는 구현에 적고 그 값을 막는 검사는 T02에서 본다.
- id: T04.04
  name: 권한을 나눈 실행
  include: 외부 도구를 서버와 다른 계정이나 다른 권한(sudo·사용자 전환·capability 제거 등)으로 실행한다. 권한을 높이는지 낮추는지와 어떤 조건(운영자 설정·도구 설정·호출 인자)에서 바꾸는지를 구현에 적는다.
  exclude: 서버와 도구를 함께 비루트 계정이나 root로 띄우는 것은 서버째 권한을 정한 것이라 세지 않는다.
- id: T04.05
  name: 실행별 작업 폴더
  include: 호출마다 새 작업 폴더를 만들어 그 폴더를 작업 위치(`cwd`)로 두고 외부 도구를 실행한다.
  exclude: 출력 파일만 임시 폴더에 쓰게 하는 것은 세지 않는다. 다른 폴더 접근을 막지 않으므로 격리 장치로 보지 않는다.
- id: T04.06
  name: 시스템 접근 제한
  include: 운영체제 기능(seccomp, namespace, Landlock 등)으로 외부 도구 프로세스의 파일·네트워크·시스템 호출 접근을 막는다.
  exclude: 외부 도구가 스스로 명령을 제한하는 설정은 T02.08이다.
- id: T04.07
  name: 컨테이너·VM
  include: 외부 도구를 서버와 분리된 컨테이너·VM에서 실행한다.
  exclude: 서버와 도구가 한 컨테이너 안에서 같은 계정으로 돌면 T04.02에 둔다.
- id: T04.08
  name: 원격 API 작업 요청
  include: 분석을 원격 백엔드·플랫폼 API에 작업으로 요청하고 결과를 받는다.
  exclude: 위협 정보 조회처럼 결과에 정보를 보태는 외부 질의는 I축에서 본다.
- id: T04.09
  name: SSH 원격 분석 호스트 명령 실행
  include: 서버가 SSH로 접속한 별도 분석 호스트에 명령을 보내 그 호스트의 접속 계정 권한으로 외부 도구를 실행하고 출력을 받는다. 접속 대상은 운영자가 설정으로 정한다.
  exclude: 도구가 서버 호스트와 다른 기계에서 돌아도 분석 호스트 안에서 계정·파일 분리를 두지 않으면 격리 장치(T04.04~T04.07)로 세지 않는다. 원격 플랫폼 API에 작업으로 맡기면 T04.08이다. 셸이 명령을 해석하는지는 T04.03에서 본다.
