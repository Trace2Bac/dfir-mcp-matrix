# T02 실행 허용 범위 제한
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: T02
name: 실행 허용 범위 제한
question: 모델이 부를 수 있는 작업과 고를 수 있는 명령·플러그인·질의를 어떻게 제한하는가?
conditional: false
boundary: 인자가 옵션으로 읽히지 않게 막는 검사도 여기에 둠. 조사 상태로 호출을 거부하면 T03
scope: 모델이 고르는 도구·작업과 서버가 외부 도구·백엔드에 넘기는 명령·플러그인·질의다. 제한이 걸린다고 구현에 적은 도구·인자에서 그 제한을 거치지 않는 호출 경로가 있거나, 모델 값이 옵션·명령으로 읽혀 제한 밖의 동작을 고를 수 있거나 그런지 확인하지 못했거나, 설정·인자로 제한을 끌 수 있으면 †를 붙인다. 제한이 없는 다른 도구·인자는 †가 아니라 구현에 적는다.
not_implemented: 모델이 부를 수 있는 작업과 고를 수 있는 명령·플러그인·질의를 서버가 좁히지 않는다. 모델이 명령 문자열 전체를 정해 그대로 실행하는 경우와 도구 설명으로 안내만 하는 경우도 여기에 둔다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: T02.01
  name: 시작 설정으로 등록 제외
  include: 운영자가 서버 시작 설정(인자·환경변수·설정 파일)으로 도구·작업을 등록하지 않아 모델에게 보이지 않게 한다.
  exclude: 코드 상수로 고정한 목록은 T02.06·T02.07이다. 클라이언트 쪽에서 숨기면 T02.03이다.
- id: T02.02
  name: 호출 시 활성 설정 검사
  include: 도구는 등록하지만 호출 때 운영자 설정으로 켜졌는지 보고 꺼져 있으면 거부한다.
  exclude: 설정이 아닌 앞선 호출의 상태로 거부하면 T03이다.
- id: T02.03
  name: 클라이언트 도구 선택
  include: 서버는 호출을 막지 않고 저장소가 함께 내놓는 클라이언트·설정의 허용 도구 목록이 모델에게 보일 도구를 고른다.
  exclude: 서버에 검사가 없어 다른 클라이언트로 붙으면 걸리지 않는다는 점을 구현에 적는다. 저장소에 그 클라이언트 구성이 없으면 연결하지 않는다.
- id: T02.04
  name: 외부 플랫폼 권한에 위임
  include: 서버는 작업을 좁히지 않고 백엔드 플랫폼의 계정·역할 권한이 허용한 작업만 실행되게 맡긴다.
  exclude: 플랫폼 권한이 실제로 작업을 막는지 확인하지 못했으면 †를 붙이고 보고서에 "실제 보호 미확인"이라고 적는다.
- id: T02.05
  name: 조사 상태로 도구 노출 조정
  include: 조사 상태·단계에 따라 서버가 모델에게 보이는 도구 목록을 바꾼다.
  exclude: 보이는 도구는 그대로 두고 호출을 거부하면 T03.02다.
- id: T02.06
  name: 고정 명령·템플릿
  include: 서버 코드가 외부 도구·백엔드의 명령과 인자 배열(또는 질의 틀)을 정해 두고 모델은 그 안의 값만 채운다.
  exclude: 값이 옵션·명령으로 읽힐 수 있거나 값으로 틀의 구조를 바꿀 수 있거나 그런지 확인하지 못했으면 †를 붙인다. 셸을 거치는지는 T04에서 본다.
- id: T02.07
  name: 연산·플러그인 허용 목록
  include: 모델이 고르는 연산·플러그인·모드를 서버 코드의 목록과 대조해 목록 밖이면 거부한다.
  exclude: 설치된 도구가 지원하는 값과 대조하면 T01.03이다. 목록 안에 자유 질의를 받는 항목이 있으면 그 질의는 T02.08에서 본다.
- id: T02.08
  name: 질의 구조·연산 검사
  include: 모델이 쓴 질의·명령·룰의 구조와 연산을 서버 코드가 검사하거나, 서버가 실행 엔진의 제한 기능(SQLite authorizer, 외부 도구의 sandbox 설정 등)을 걸어 허용한 연산만 통과시킨다.
  exclude: 문법 오류만 거르는 검사는 세지 않는다. 모델이 그 제한을 끌 수 있거나 검사를 거치지 않는 질의 경로가 있으면 †를 붙인다.
- id: T02.09
  name: 사전 등록된 백엔드 작업만 호출
  include: 서버가 미리 등록한 백엔드 작업(아티팩트·저장 질의·작업 이름)만 호출하고 모델은 그중에서 고른다.
  exclude: 모델이 백엔드 작업 정의 자체를 보내면 제외한다. 서버 코드 안의 연산 목록이면 T02.07이다.
