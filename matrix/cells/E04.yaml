# E04 분석 입력 준비
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: E04
name: 분석 입력 준비
question: 이미지·보관 파일·수집물에서 어떤 범위를 어떤 입력으로 준비하고, 트랜잭션 로그·분할 이미지 같은 부속 자료를 어떻게 찾아 반영하는가?
conditional: false
scope: 서버가 이미지·보관 파일·수집물에서 분석 입력을 만드는 도구·경로와, 그 입력의 부속 자료(분할 조각·트랜잭션 로그·`-wal` 등)를 찾고 반영하는 경로다. 구현에 적은 경로 안에서 방식이 설명과 다르게 입력을 만들거나(다른 출처의 파일을 섞음, 엉뚱한 파일을 입력으로 씀), 설정·인자로 끄거나, 실패·누락을 알리지 않고 지나가면 †를 붙인다. 받은 경로를 그대로 외부 도구에 넘겨 입력을 준비하지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 이미지·보관 파일·수집물을 받는데 서버가 입력을 따로 준비하지 않고 받은 경로를 그대로 외부 도구에 넘기며 부속 자료도 다루지 않는다.
not_applicable: 서버가 이미지·보관 파일·수집물 같은 증거 입력을 받지 않는다.
details:
- id: E04.01
  name: 작업 사본 생성
  include: 서버가 증거 파일이나 보관 파일의 내용을 통째로 별도 작업 위치에 복사하거나 풀어 그 사본을 분석 입력으로 쓴다.
  exclude: 이미지에서 필요한 파일만 꺼내면 E04.02다. 사본 생성을 원본 변경 방지로 세지 않는다(E03). 사본을 어디에 쓰고 덮어쓰는지는 D04다.
- id: E04.02
  name: 선택 추출
  include: 이미지·보관 파일에서 경로·이름·inode로 고른 파일만 꺼내 분석 입력으로 쓴다.
  exclude: 고르는 기준(경로 대조 방식)과 꺼낸 위치를 보고서에 적는다. 꺼낸 범위를 응답·기록에 남기는지는 E04.05다.
- id: E04.03
  name: 전체·부분 마운트
  include: 이미지나 그 안의 파티션·볼륨을 파일시스템으로 마운트해 분석 도구가 그 마운트 아래 파일을 읽게 한다.
  exclude: 마운트의 읽기 전용 여부는 E03.01에서 본다. 이미지를 평면 파일로만 보이게 하는 장치는 마운트한 범위를 보고서에 적는다.
- id: E04.04
  name: 메모리 사본 파싱
  include: 메모리 덤프를 분석하기 전에 서버가 형식을 바꾸거나 사본을 만들어 그것을 분석 입력으로 쓴다.
  exclude: 덤프를 그대로 분석 도구에 넘기면 입력 준비로 세지 않는다. 덤프에서 파일·프로세스를 꺼내는 것은 E04.02다.
- id: E04.05
  name: 추출·생략 범위 기록
  include: 서버가 준비한 입력의 범위(꺼낸 파일 목록·건수·크기)나 빼거나 꺼내지 못한 범위를 응답이나 기록에 남긴다.
  exclude: 도구 출력의 잘림은 R02, 실행 실패 상태는 R03·T08에서 본다. 서버 운영 로그에만 남기는 경고는 세지 않고 보고서에 적는다.
- id: E04.06
  name: 동반 파일 탐색
  include: 서버 코드가 입력 옆의 분할 조각·트랜잭션 로그·`-wal` 같은 부속 파일을 찾아 입력과 함께 넘기거나 옮긴다.
  exclude: 외부 도구가 스스로 부속 파일을 찾는 것과 경로 대조에 우연히 걸려 함께 꺼내지는 것은 세지 않고 보고서에 적는다.
- id: E04.07
  name: 부속 자료 누락·로그 미반영 표시
- id: E04.08
  name: 로그 재생·복원
  include: 서버 코드가 트랜잭션 로그·`-wal`을 입력에 적용하거나 적용하는 외부 도구에 로그를 함께 넘기거나 적용 여부를 인자로 정해 마지막 상태의 입력을 만든다.
  exclude: 로그를 찾아 함께 옮기는 일은 E04.06, 적용했는지 응답에 표시하는 일은 E04.07이다. 적용을 외부 도구에 맡기면 그 사실과 실제 적용을 확인했는지 보고서에 적는다.
- id: E04.09
  name: 적용 전후 입력 구분
