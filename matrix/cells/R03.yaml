# R03 분석 상태 알림
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: R03
name: 분석 상태 알림
question: 호출자에게 분석 완료·오류·부재·누락과 실행 중 상태를 어떻게 알리는가?
conditional: false
scope: 그 상태 값·목록이 붙는다고 구현에 적은 도구의 응답이다. 그 도구 안에서 실패·부분 완료·생략이 성공 값으로 나가거나 상태가 응답에서 잘려 보이지 않거나 상태 값이 실제와 다른 경로가 있으면 †를 붙인다. 상태를 싣지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 응답에 성공과 실패를 가르는 값이 없고 MCP 오류 결과도 쓰지 않는다. 문장으로만 알리는 경우도 여기에 둔다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: R03.01
  name: 구조화 status·error
  include: 응답의 정해진 필드(status·오류 종류)나 MCP 오류 결과(isError)로 성공과 실패를 가른다.
  exclude: 문장으로만 알리면 제외한다. 실패를 알아차리는 방식은 T08, 기록에 남기는 방식은 L02에서 본다.
- id: R03.02
  name: 찾지 못함과 실패 구분
  include: 결과가 없는 것(일치 0건·대상 없음)을 실행 실패나 입력 부재와 다른 상태 값·필드로 돌려준다.
  exclude: 빈 결과와 실패를 같은 값으로 돌려주거나 문장으로만 가르면 제외한다.
- id: R03.03
  name: 입력별 성공·실패·생략 목록
  include: 입력이나 하위 작업 여러 개를 처리한 응답에 항목마다 성공·실패·생략과 그 식별자를 싣는다.
  exclude: 개수만 싣으면 제외한다. 무엇을 수행했고 끝났는지 판단하는 점검 도구는 P03에서 본다.
- id: R03.04
  name: 시간 초과·부분 완료 표시
  include: 시간 초과나 중단으로 결과가 없거나 일부만 나왔다는 것을 상태 값이나 필드로 알린다.
  exclude: 결과 본문에 문장만 덧붙이면 제외한다. 비동기 작업의 종료를 판별하는 방식은 T08에서 본다.
- id: R03.05
  name: 실행 중 경과·생존 알림
  include: 오래 걸리는 호출이 끝나기 전에 서버가 MCP 진행 알림 같은 경로로 실행 중임·경과 시간·진행 정도를 호출자에게 보낸다.
  exclude: 경과 시간이나 생존만 알리고 실제 분석 진행률이 아니면 그 사실을 원고 구현에 적는다. 완료 뒤 상태를 알리는 것은 R03.01~R03.04다.

