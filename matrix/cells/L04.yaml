# L04 기록 위변조 방지
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: L04
name: 기록 위변조 방지
question: 기록의 수정·삭제·순서 변경을 어떻게 막거나 알아보는가?
conditional: false
boundary: 일련번호만으로는 삭제·재생성을 잡는다고 보지 않음. 모델 도구로 기록을 지울 수 있으면 †
scope: 서버가 쓰는 기록 파일·DB 전체다. 이 방식이 걸리지 않는 기록 종류·쓰기 경로가 있거나, 모델이 부를 수 있는 도구로 기록을 지우거나 덮어쓸 수 있거나, 설정으로 검증을 끌 수 있으면 †를 붙인다.
not_implemented: 기록의 수정·삭제·순서 변경을 막거나 알아보는 장치가 없다. 파일을 덧붙이기 모드로 여는 것만으로는 막는 장치로 세지 않는다.
not_applicable: 서버가 기록을 남기지 않는다.
details:
- id: L04.01
  name: 해시 체인
  include: 항목마다 앞 항목의 해시를 넣어 해시를 이어 수정·삭제·순서 변경이 뒤 항목의 해시와 어긋나게 한다.
  exclude: 항목마다 따로 낸 해시는 체인이 아니다. 체인 끝 값을 밖에 두는지는 L04.04, 체인을 검증하는 도구는 L04.06이다.
- id: L04.02
  name: 서명·MAC
  include: 항목이나 체인 끝 값에 키로 서명·MAC을 붙여 키가 없는 쪽이 고친 항목을 알아보게 한다.
  exclude: 키를 기록과 같은 권한으로 읽을 수 있으면 구현에 적는다. 키 없이 계산하는 해시만 있으면 L04.01이다.
- id: L04.03
  name: 일련번호
  include: 항목에 끊기지 않는 일련번호를 매겨 중간 항목의 삭제·끼워 넣기를 드러낸다.
  exclude: 호출 ID처럼 순서가 없는 식별자는 일련번호가 아니다. 일련번호만으로는 끝 항목 삭제나 파일 전체 재생성을 잡지 못한다.
- id: L04.04
  name: 외부 기준점(체인 끝 값의 외부 보관)
  include: 체인 끝 값이나 항목 수를 기록 밖(별도 저장소·외부 서비스·보고 산출물)에 남겨 나중에 대조할 수 있게 한다.
  exclude: 같은 파일·같은 DB 안에 두면 이 항목이 아니다.
- id: L04.05
  name: 쓰기 권한 분리·추가 전용 저장
  include: 기록을 서버 프로세스나 모델 도구가 고칠 수 없는 권한·저장소(추가 전용 속성, 별도 계정, 덮어쓸 수 없는 저장소)에 둔다.
  exclude: 파일을 덧붙이기 모드로 여는 것만으로는 이 항목이 아니다.
- id: L04.06
  name: 검증 도구
  include: 기록의 체인·서명·일련번호를 다시 계산해 어긋난 항목을 알려 주는 도구나 명령이 있다.
  exclude: 기록이 아닌 증거·파생물의 해시를 검증하는 도구는 이 항목이 아니다.
