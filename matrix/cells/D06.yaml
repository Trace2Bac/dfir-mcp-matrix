# D06 결론 도출
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: D06
name: 결론 도출
question: 관계·집계·점수·공격 흐름 서술을 어떤 규칙·모델·증거로 만들고 그 근거를 어떻게 남기는가?
conditional: false
boundary: 만든 결론을 심사해 확정을 막는 것은 D07
scope: 서버가 여러 도구 결과·발견사항을 분류해 잇거나 집계·점수·공격 흐름 서술을 만드는 도구·경로다. 도구 설명이 그런 결론을 만든다고 적은 도구와 보고 산출물을 만들며 계산하는 경로도 든다. 그 경로가 설명하거나 코드에 정해 둔 규칙·입력과 다르게 계산하거나, 결론의 근거로 남긴 값이 실제 입력과 다르면 †를 붙인다. 결론을 만들지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 서버는 도구 출력을 옮기거나 걸러 돌려줄 뿐 결과끼리 잇거나 집계·점수·흐름 서술을 만들지 않는다. 결론은 모델이 만든다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: D06.01
  name: 규칙·키 기반 상관
  include: 정한 규칙(키워드·이벤트 ID·포트 목록)이나 공유 키(PID·IP·실행 파일 이름·근거 호출 ID)로 여러 결과 항목을 분류하고 잇는다.
  exclude: 시각 차이·시간 범위로 잇는 것은 D06.02, 공격 단계로 나누는 것은 D06.06이다. 한 도구 출력의 필드를 옮기기만 하면 R01에서 본다.
- id: D06.02
  name: 시간·공간 근접성 연결
  include: 정한 시각 차이·시간 범위나 위치(호스트·오프셋)의 가까움으로 서로 다른 결과 항목을 잇거나 묶는다.
  exclude: 같은 값의 키로 잇는 것은 D06.01이다. 결과를 시각순으로 정렬하기만 하면 제외한다.
- id: D06.03
  name: 통계·점수 산정
  include: 정한 가중치·평균·유사도·건수로 항목마다 점수나 등급을 계산해 결과에 싣거나 정렬·병합 같은 판단에 쓴다.
  exclude: 외부 서비스가 준 점수를 옮기기만 하면 제외하고 여러 값을 합쳐 새 점수를 만들면 든다. 발견사항의 판정 등급을 근거로 정하는 것은 D07.03이다.
- id: D06.04
  name: 모델 추론·서술
  include: 서버 안에서 부른 모델이 도구 결과·발견사항을 읽고 관계·판단·공격 흐름 서술을 만든다.
  exclude: 클라이언트 모델이 써서 제출한 서술을 저장하기만 하면 제외하고 D08에서 본다. 만든 결론을 모델이 심사해 확정을 정하면 D07.05다.
- id: D06.05
  name: 사용 근거·변환 기록
  include: 결론을 만들 때 읽은 입력(하위 조회·호출 ID·자료 이름)과 적용한 규칙·변환을 호출 기록이나 결과에 남긴다.
  exclude: 발견사항이 인용한 근거를 저장하는 것은 D05, 파생물과 입력의 계보 일반은 D02다. 빠진 입력 목록만 싣고 쓴 입력을 남기지 않으면 제외한다.
- id: D06.06
  name: 규칙 기반 공격 단계 분류·흐름 서술
  include: 정한 규칙(키워드·ATT&CK 기법과 tactic의 대응·킬체인 순서)으로 발견사항·지표를 공격 단계에 나누거나 시간 순서의 흐름 문장·표를 만든다.
  exclude: 서버 안에서 부른 모델이 서술을 만들면 D06.04다. 모델이 써서 제출한 서술을 저장해 보고서에 싣기만 하면 이 셀이 아니라 D08에서 본다.
