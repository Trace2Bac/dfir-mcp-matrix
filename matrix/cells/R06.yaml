# R06 증거에서 추출한 민감정보 노출 제어
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: R06
name: 증거에서 추출한 민감정보 노출 제어
question: 증거에서 나온 비밀번호 해시·키 같은 민감한 값을 응답·기록·보고서에서 어떻게 다루는가?
conditional: false
boundary: 응답은 모델 제공자에게 가는 첫 경로라 외부 연동이 없는 서버에도 적용함. 응답·기록·보고서 가운데 어디에 적용하는지는 상세가 아니라 원고 구현에 적음. 제3자 서비스로 보낼 때의 가림은 I03
scope: 가림·제외가 걸린다고 구현에 적은 값과 그 값을 다루는 도구다. 같은 값이 그 도구의 다른 필드·다른 반환 형식·저장 본문이나 우회 호출 경로로 그대로 나가거나 가림이 설정이나 오류 때 꺼지면 †를 붙인다. 가림이 없는 다른 도구·값은 †가 아니라 구현에 적는다.
not_implemented: 증거에서 나온 비밀 값을 응답·기록·보고서에 그대로 싣고 가리거나 빼는 코드가 없다. 가림 함수를 두었지만 부르는 곳이 없는 경우도 여기에 둔다.
not_applicable: 서버가 증거에서 나온 값을 응답·기록·보고서 어디에도 싣지 않는다.
details:
- id: R06.01
  name: 값 가림·필드 제외
  include: 증거에서 나온 비밀 값(비밀번호와 그 해시, 키, 토큰)을 응답·기록·보고서에 싣기 전에 가린 값으로 바꾸거나 그 필드를 뺀다. 증거에서 찾아 호출 인자로 다시 넘긴 비밀번호를 가리는 것도 든다.
  exclude: 서버가 외부에 붙을 때 쓰는 자격증명의 가림은 I04, 제3자 서비스로 보낼 때의 가림은 I03에서 본다. 가림 함수가 있어도 부르는 경로가 없으면 연결하지 않는다.
- id: R06.02
  name: 역할·승인별 표시
retired:
- id: R06.03
  name: 적용 위치별(응답·기록·보고서) 처리
  reason: 상세가 아니라 관점이다. 응답·기록·보고서 가운데 어디에 적용하는지는 R06.01·R06.02의 원고 구현에 적는다
