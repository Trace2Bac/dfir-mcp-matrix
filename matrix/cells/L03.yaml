# L03 기록 실패 처리
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: L03
name: 기록 실패 처리
question: 기록 쓰기가 실패할 때 실행·결과 전달을 어떻게 처리하는가?
conditional: false
scope: 서버 기록에 항목을 쓰는 호출이다. 기록을 만드는 장치와 그 장치를 거치지 않는 호출은 L01에서 본다. 기록 쓰기 예외를 잡아 다른 동작으로 넘어가는 도구·경로가 있거나, 설정·인자로 처리가 바뀌거나, 쓰기 실패 때의 동작을 확인하지 못한 경로가 있으면 †를 붙인다.
not_implemented: 없음. 기록을 쓰는 서버는 쓰기가 실패할 때 아래 상세 가운데 하나로 동작한다.
not_applicable: 서버가 기록을 남기지 않는다.
details:
- id: L03.01
  name: 실행 전 중단
  include: 실행 전에 요청 항목을 쓰고 그 쓰기가 실패하면 도구를 실행하지 않고 오류를 돌려준다.
  exclude: 실행 뒤 쓰기가 실패해 결과만 막으면 L03.02다.
- id: L03.02
  name: 실행 후 응답 차단
  include: 실행을 마친 뒤 기록을 쓰고 쓰기가 실패하면 그 호출의 결과를 돌려주지 않는다. 쓰기 예외를 따로 잡지 않아 호출이 오류로 끝나는 경우도 든다.
  exclude: 실행 전에 기록을 쓰고 그 쓰기가 실패하면 실행하지 않는 방식은 L03.01이다. 실행이 남긴 부수 효과(적재한 자료·쓴 파일)가 남는지는 구현에 적는다.
- id: L03.03
  name: 경고 후 계속
  include: 기록 쓰기가 실패해도 결과를 돌려주고 응답이나 서버 로그에 기록 실패를 남긴다.
  exclude: 어디에도 남기지 않으면 L03.04다. 응답에 알리는지 서버 로그에만 남기는지는 구현에 적는다.
- id: L03.04
  name: 알림 없이 계속
  include: 기록 쓰기 실패를 호출한 쪽으로 넘기지 않고 응답에도 서버 로그에도 남기지 않은 채 결과를 돌려준다.
  exclude: 실패를 응답이나 서버 로그에 남기면 L03.03이다.
- id: L03.05
  name: 재시도·별도 저장
  include: 기록 쓰기가 실패하면 같은 항목을 다시 쓰거나 다른 파일·저장소에 남겨 나중에 합칠 수 있게 한다.
  exclude: 예외 처리에서 같은 기록 함수로 오류 항목을 한 번 더 쓰려는 것은 재시도로 세지 않는다.
