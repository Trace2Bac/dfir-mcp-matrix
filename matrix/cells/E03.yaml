# E03 원본 변경 방지
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: E03
name: 원본 변경 방지
question: 원본에 닿는 경로에서 누가 어떤 장치로 변경을 막는가?
conditional: false
scope: 원본 증거에 닿는 경로다. 서버 코드와 서버가 부르는 외부 도구의 경로가 모두 든다. 그 가운데 장치가 걸리지 않거나 확인하지 못한 경로가 있으면 †를 붙인다. 상세는 변경을 막는 주체(실행 환경·서버 코드·외부)로 나누고 어떤 장치인지는 보고서 구현에 적는다.
not_implemented: 원본에 닿는 경로에 변경을 막는 장치가 없고 E03.03에도 들지 않는다.
not_applicable: 서버와 서버가 부르는 외부 도구가 증거 원본에 접근하지 않는다.
details:
- id: E03.01
  name: 실행 환경의 읽기 전용 강제
  include: 저장소가 지원하는 실행·배포 경로가 실제 증거 폴더를 컨테이너에 읽기 전용으로 연결하거나, 증거 이미지·파일시스템을 읽기 전용으로 마운트하고 분석 경로가 그 마운트를 쓴다.
  exclude: 설정·자격증명 폴더만 읽기 전용인 경우와 임의 운영자 배포는 제외한다. 사용하지 않는 마운트나 마운트 밖 원본 접근은 이 보호의 적용 범위에 넣지 않는다.
  seen_in: [ChainsawMCP]
- id: E03.02
  name: 서버 코드의 원본 쓰기 제한
  include: 서버 코드가 원본을 읽기 모드로 열거나(`rb`, SQLite `mode=ro` 등), 생성·수정 대상이 원본 증거·원본 영역과 겹치는지 검사해 거부하거나, 변경 경로를 분리된 작업 입력으로 정해 원본을 변경 대상으로 고르는 경로를 막는다.
  exclude: 읽기 모드로 연 경로의 보호를 다른 원본 쓰기 경로까지 넓혀 인정하지 않는다. 원본과의 충돌을 확인하지 않는 출력 폴더 지정과 사본 생성만으로는 연결하지 않는다(사본 생성은 E04).
  seen_in: [MyIRTeam]
- id: E03.03
  name: 외부 도구·플랫폼에 위임
  include: 서버에는 쓰기를 막는 장치가 없고 원본 보호를 읽기만 하는 외부 도구·라이브러리의 동작이나 감싸는 플랫폼(Velociraptor 등)의 계정 권한에 맡긴다. 보호를 맡긴 구조를 뜻하고 검증된 원본 쓰기 방지를 뜻하지 않는다.
  exclude: 서버가 원본에 쓸 수 있게 만드는 인자·옵션을 외부 도구에 넘길 수 있거나, 플랫폼 계정 권한과 아티팩트가 실제로 원본 변경을 막는지 확인하지 못했으면 †를 붙인다. 확인하지 못했으면 보고서에 "실제 보호 미확인"이라고 적는다. T02의 "외부 플랫폼 권한에 위임"과 같은 기준이다. 다른 장치도 있으면 함께 연결한다.
  seen_in: [ChainsawMCP, agentic-velociraptor-mcp]
