# P02 다음 작업 결정
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: P02
name: 다음 작업 결정
question: 절차·작업 묶음·다음 작업을 어떻게 정하는가?
conditional: false
scope: 서버가 절차·작업 묶음·다음 작업을 정하거나 권한다고 구현에 적은 도구와 응답이다. 그 권고가 확인하지 않은 사실을 단정하거나, 판별을 잘못한 입력에 맞지 않는 작업을 권하거나, 권고 근거가 대상 일부만 보면 †를 붙인다. 권고가 없는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 서버가 절차·다음 작업을 정하거나 권하지 않고 모델이 도구 목록만 보고 고른다. 도구 하나의 설명에 적힌 순서 안내만 있는 경우도 여기에 둔다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: P02.01
  name: 고정 문서·프로필 반환
  include: 서버가 미리 정한 절차서·도구 안내·조사 프로필을 도구·리소스·지침으로 돌려준다. 조사 상태와 관계없이 같은 내용이다.
  exclude: 도구 설명 안의 순서 안내만 있으면 연결하지 않는다. 조사 상태에 따라 내용이 바뀌면 P02.02다.
- id: P02.02
  name: 규칙·조사 상태로 추천
  include: 서버가 규칙과 조사 상태(적재한 자료, 호출 기록, 판별한 형식, 남은 조건)를 보고 다음에 할 작업을 응답에 싣는다.
  exclude: 권고를 따르지 않은 호출을 막으면 T03에서 본다. 수행 범위와 완료를 판단하는 것은 P03에서 본다.
- id: P02.03
  name: 모델 계획 생성
  include: 서버 안에서 부른 모델이 조사 상태를 받아 절차나 다음 작업 계획을 만든다.
  exclude: 서버를 쓰는 클라이언트·오케스트레이터의 모델이 세운 계획은 연결하지 않고 원고에 사실로 적는다.
- id: P02.04
  name: 서버 코드에 고정한 분석 절차
  include: 서버가 한 조사 목적의 분석 단계와 그 차례·결과 결합을 코드로 묶은 도구·메서드를 두어 모델은 묶음과 인자만 고르고 그 안의 단계는 서버가 정한다.
  exclude: 절차를 문서로 안내만 하면 P02.01이다. 조사 상태를 보고 다음 작업을 권하면 P02.02다. 묶음 안 단계의 실패·생략을 알리는 일은 P03.04와 T08에서 본다.
