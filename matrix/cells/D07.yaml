# D07 결론 근거 검증
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: D07
name: 결론 근거 검증
question: 발견사항·부재 결론의 근거가 있고 맞는지 서버가 어떻게 확인해 판정을 정하는가?
conditional: false
boundary: D07.02는 서버가 근거 내용을 대조하는 것 자체를 세고 그 결과를 판정에 쓰는지는 구현에 적음. 다른 상세는 검토를 통과해야 발견사항이 확정되는 게이트만 심사로 세고 검토자에게 보여 주기만 하는 기능과 가름. 범위·실패·잘림 대조 없이 결론을 한정하는 문구만 있으면 D08
scope: 서버가 발견사항·부재 결론을 받아 저장하거나 고치거나 합치는 도구·경로다. 그 경로에 근거 검사를 거치지 않는 인자·모드가 있거나, 검사 중 오류가 나면 통과시키거나, 검사한 값과 다른 값이 저장되면 †를 붙인다. 검사가 없는 다른 필드·도구는 †가 아니라 구현에 적는다.
not_implemented: 발견사항을 받아 저장하지만 근거가 있는지·맞는지 서버가 확인하지 않는다. 근거를 적으라고 안내하거나 등급 경고만 붙이는 경우도 여기에 둔다.
not_applicable: 서버가 발견사항·부재 결론을 받거나 저장하지 않는다.
details:
- id: D07.01
  name: 근거 참조 존재 확인
  include: 발견사항이 인용한 근거(호출 ID·자료 이름·출력 위치)가 서버 기록이나 사건 자료에 있는지 보고 없으면 거부한다.
  exclude: 인용한 근거의 내용이 주장과 맞는지 보면 D07.02다. 근거 필드가 비어 있지 않은지만 보면 D05에서 본다.
- id: D07.02
  name: 도구 출력과 내용 대조
  include: 발견사항의 주장·인용 문구·값이 인용한 호출의 저장된 출력에 실제로 있는지 서버가 대조한다. 대조 방법과 그 결과로 거부하는지, 등급을 바꾸는지, 응답에 표시만 하는지 구현에 적는다.
  exclude: 호출 ID가 기록에 있는지만 보면 D07.01이다. 대조 결과를 보고서에 싣는 방식은 D08에서 본다.
- id: D07.03
  name: 출처 수·범주로 등급 산정
  include: 인용한 근거의 수와 종류(아티팩트 범주)로 서버가 발견사항의 확신 등급을 정하거나 모델이 고른 등급을 거부·조정한다.
  exclude: 근거 수가 모자랄 때 안내만 붙이면 제외한다. 결과 항목에 점수를 붙이는 일반 계산은 D06.03이다.
- id: D07.04
  name: 교차 확인·반론 검토
  include: 같은 주장을 다른 출처·도구로 다시 확인하게 하거나 반론·대안 가설을 받아 그 결과로 서버가 발견사항의 확정 여부를 정한다.
  exclude: 반론을 저장하고 추적하는 방식은 D05다. 교차 확인 도구를 권하기만 하면 R04이고, 근거가 늘 때 등급을 다시 계산하기만 하면 D07.03이다. 클라이언트 오케스트레이터가 반론 단계를 돌리면 서버 구현으로 세지 않고 원고 구현에 사실로 적는다.
- id: D07.05
  name: 모델 검토
  include: 서버 안에서 부른 검토 모델이 발견사항과 근거를 읽고 낸 판정으로 확정이나 등급을 정한다.
  exclude: 검토 모델의 입력·응답 보존은 L02, 모델과 그 버전 표시는 T06이다. 판정을 검토자에게 보여 주기만 하면 제외한다.
- id: D07.06
  name: 사람 검토
  include: 사람 검토자의 승인·반려 기록이 있어야 서버가 발견사항을 확정하거나 보고 산출물에 싣는다.
  exclude: 보고서를 사람이 읽는다는 사실만으로는 들지 않는다. 승인 기록으로 호출 자체를 막는 장치는 T03에서 본다.
- id: D07.07
  name: 부재 주장의 필수 출처·기간 대조
  include: 부재 결론을 받을 때 그 주장 범주에 필요한 출처를 모두 조회했는지와 조회 기간이 주장 기간을 덮는지 서버가 대조하고 모자라면 거부한다.
  exclude: 부재 결론을 한정하는 문구만 붙이면 D08에서 본다.
- id: D07.08
  name: 부재 주장의 미처리·실패·잘림 대조
  include: 부재 결론의 근거 호출이 실패했거나 결과가 잘렸거나 처리하지 못한 입력이 있으면 서버가 그 결론을 거부하거나 한정한다.
  exclude: 잘림·실패를 응답에 알리기만 하는 것은 R02·R03에서 본다.
- id: D07.09
  name: 부재 주장의 추가 확인 요구
  include: 부재 결론을 확정하기 전에 서버가 추가 조회나 다른 출처 확인을 요구하고 그 호출이 기록에 있어야 받아들인다.
  exclude: 추가 확인을 권하기만 하면 R04에서 본다.
