# I02 분석 도구 통신 차단
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: I02
name: 분석 도구 통신 차단
question: 서버가 부르는 분석 도구·의존성이 스스로 여는 통신을 어떻게 제한하는가?
conditional: false
boundary: 로컬 참조 자료를 쓴다는 것만으로는 통신 제한으로 세지 않음
scope: 서버가 실행하거나 부르는 분석 도구·라이브러리가 스스로 여는 통신(룰·심볼·업데이트 내려받기, 평판 조회, 원격 전송)이다. 서버 코드가 일부러 여는 연결은 I01에서 본다. 구현에 적은 실행 경로 안에서 그 제한이 빠지는 도구·인자·설정이 있거나 제한을 걸지 못해도 그대로 실행하면 †를 붙인다.
not_implemented: 분석 도구·라이브러리를 부르는데 그 통신을 끊거나 끄는 장치가 없다. 갱신·조회 인자를 붙이지 않는 것만으로는 제한으로 세지 않고 여기에 둔다.
not_applicable: 서버가 외부 분석 도구·라이브러리를 부르지 않고 서버 코드만으로 분석한다.
details:
- id: I02.01
  name: 네트워크 차단(컨테이너 none·namespace·방화벽)
  include: 서버 코드나 저장소가 지원하는 실행 구성이 분석 도구 프로세스의 네트워크를 끊는다(컨테이너 `--network none`, network namespace, 방화벽 규칙).
  exclude: 문서가 권하기만 하고 서버 코드·배포 구성에 없으면 제외한다.
- id: I02.02
  name: 오프라인 옵션
  include: 분석 도구를 실행할 때 그 도구의 오프라인·갱신 끄기 옵션(`--offline` 등)을 붙이거나 라이브러리의 오프라인 설정을 켠다.
  exclude: 갱신·조회 인자를 붙이지 않는 것만으로는 세지 않는다.
- id: I02.03
  name: DNS 조회 끄기
  include: 분석 도구가 결과를 만들며 하는 이름 풀이(역방향 DNS 등)를 끄는 옵션을 붙인다.
  exclude: 도구가 처음부터 이름 풀이를 하지 않는 것은 세지 않는다.
- id: I02.04
  name: 프록시·목적지 제한
  include: 분석 도구 프로세스의 통신을 환경변수·설정으로 프록시나 허용 목적지로만 나가게 묶는다.
  exclude: 서버 코드 자신의 연결 목적지 제한은 I01.09다.
