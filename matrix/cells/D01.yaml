  name: 저장 실패 시 오류·부분 완료 표시
  merged_into: D09.01
  reason: 저장 실패 처리를 D09 셀로 나눴다(docs/decisions/0002)
- id: D01.07
  name: 저장 재시도·대체 저장
  merged_into: D09.02
  reason: 저장 실패 처리를 D09 셀로 나눴다(docs/decisions/0002)
- id: D01.08
  name: 저장 확인·검증
  merged_into: D09.03
  reason: 저장 실패 처리를 D09 셀로 나눴다(docs/decisions/0002)
- id: D01.09
  name: 저장 실패 알림 없이 계속
  merged_into: D09.04
