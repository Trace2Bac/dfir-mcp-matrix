# I04 서버 자격증명 처리
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: I04
name: 서버 자격증명 처리
question: 서버가 외부에 붙을 때 쓰는 API 키·인증서·토큰을 어디에 보관하고 응답·기록에서 어떻게 제외하는가?
conditional: false
scope: 서버 코드가 외부 서비스·백엔드에 붙을 때 쓰는 자격증명(API 키·토큰·인증서·비밀번호)이다. 서버를 부르는 호출자의 인증은 T03, 증거에서 나온 비밀값은 R06에서 본다. 자격증명이 구현에 적은 보관 위치 밖에서 들어오거나 도구 인자·응답·기록·오류 문구로 나가는 경로가 있거나, 검사가 실패해도 그대로 쓰면 †를 붙인다.
not_implemented: 자격증명을 코드나 저장소 파일에 그대로 적어 두거나 도구 인자로 받고, 응답·기록에서 빼는 처리도 없다.
not_applicable: 서버 코드가 자격증명이 필요한 외부 연동을 하지 않는다.
details:
- id: I04.01
  name: 환경변수·설정 파일에 분리 보관
  include: 자격증명을 코드 밖 환경변수나 설정 파일에 두고 서버가 실행 중에 읽는다.
  exclude: 비밀 관리 도구나 실행 환경이 실행할 때 넣어 주고 서버 설정에 남기지 않으면 I04.02다.
- id: I04.02
  name: 실행 시 주입
  include: 비밀 관리 도구(vault·keyring·컨테이너 secret)나 클라이언트가 실행할 때 자격증명을 넣어 주고 서버 설정에는 값을 두지 않는다.
  exclude: 운영자가 미리 설정한 환경변수를 읽기만 하면 I04.01이다.
- id: I04.03
  name: 설정 파일 권한 검사
  include: 자격증명을 담은 파일의 소유자·권한을 서버가 검사하고 너무 넓으면 경고하거나 거부한다.
  exclude: 문서가 권한을 권하기만 하면 제외한다.
- id: I04.04
  name: 도구 인자 수신 금지
  include: 자격증명을 도구 인자로 받지 않고 서버가 직접 읽어 모델이 값을 보거나 넘기지 않는다.
  exclude: 값이 아닌 이름(프로필 이름 등)만 인자로 고르게 하는 것은 여기에 둔다.
- id: I04.05
  name: 응답·기록·오류에서 비밀값 제거
  include: 응답·호출 기록·로그·오류 문구에서 자격증명 값을 찾아 지우거나 가린다.
  exclude: 자격증명을 처음부터 응답·기록에 넣지 않는 것은 제거 장치로 세지 않고 원고 구현에 적는다.
- id: I04.06
  name: 권한·수명 제한
  include: 서버가 쓰는 자격증명의 권한 범위(읽기 전용 등)나 유효 기간을 서버 코드나 저장소의 구성이 좁힌다.
  exclude: 문서가 좁은 권한을 권하기만 하면 제외한다.
