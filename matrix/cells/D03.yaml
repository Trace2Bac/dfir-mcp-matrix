# D03 파생물 무결성 검증
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: D03
name: 파생물 무결성 검증
question: 서버가 만든 파생물의 어떤 내용을 언제 해시해 어디에 남기고, 그 기준값과 현재 파생물을 어떻게 대조해 차이를 처리하는가?
conditional: false
scope: 서버가 만든 파생물(보관한 도구 출력, 파일로 남는 파생물, 보고 산출물)의 해시와 대조다. 상세마다 그 방식이 걸린다고 구현에 적은 파생물이 적용 범위다. 그 범위 안에서 해시를 남기지 않거나, 대조에서 빠지거나, 대조 결과가 실제와 다르게 보고되는 경로가 있으면 †를 붙인다. 해시가 없는 다른 파생물은 †가 아니라 구현에 적는다.
not_implemented: 파생물을 남기지만 그 해시를 얻지도 대조하지도 않는다. 호출 기록에 응답·요약값의 해시만 남기는 경우도 여기에 둔다.
not_applicable: 서버가 파생물을 남기지 않는다(D01 미구현).
details:
- id: D03.01
  name: 생성 시 자동 해시
  include: 파생물을 만들거나 보관할 때 서버가 자동으로 그 해시를 계산한다.
  exclude: 모델이 해시 도구를 불러야 얻으면 D03.02다. 원본 증거의 해시는 E02다.
- id: D03.02
  name: 요청한 도구에서 해시
  include: 모델·운영자가 고른 파생물의 해시를 계산해 돌려주는 도구·명령이 있다.
  exclude: 증거와 파생물을 가리지 않는 범용 해시 도구는 파생물 경로도 받는다는 이유만으로 연결하지 않는다.
- id: D03.03
  name: 파일 전체 해시
  include: 파생물 전체(파일 전체 바이트나 보관한 출력 전체)를 해시 범위로 삼는다.
  exclude: 앞부분·표본·요약값만 해시하면 연결하지 않고 무엇을 해시하는지 구현에 적는다.
- id: D03.04
  name: 응답에 해시·크기 표시
  include: 파생물을 만든 도구나 조회 도구의 응답에 파생물의 해시·크기를 싣는다.
  exclude: 호출 기록이나 manifest에만 남으면 D03.05다.
- id: D03.05
  name: 호출 기록·manifest에 해시 기록
  include: 파생물의 해시를 그것을 만든 호출의 기록이나 파생물 곁 manifest에 남긴다.
  exclude: 응답 전체나 요약값의 해시만 기록하면 연결하지 않는다.
- id: D03.06
  name: 해시 재계산·대조
  include: 남겨 둔 기준값과 지금 파생물에서 다시 계산한 해시를 대조한다.
  exclude: 서명·MAC 검증은 D03.07이다. 대조를 언제 하는지는 D03.09·D03.11로 나눠 본다. 무엇을 대조하지 않는지는 구현에 적는다.
- id: D03.07
  name: 서명·MAC 검증
  include: 서버가 가진 키로 파생물에 서명·MAC을 붙이고 그것을 검증한다.
  exclude: 키 없이 해시만 대조하면 D03.06이다.
- id: D03.08
  name: 기준값 분리 보관
  include: 기준 해시를 파생물과 다른 곳(별도 파일·외부 저장소·쓰기를 막은 기록)에 두어 파생물과 함께 바뀌지 않게 한다.
  exclude: 기준값이 파생물과 같은 DB 파일·행이나 같은 폴더의 고칠 수 있는 파일에 있으면 연결하지 않고 구현에 적는다.
- id: D03.09
  name: 사용 전 대조
  include: 파생물을 읽어 응답·분석·보고에 쓰기 전에 서버가 스스로 기준값과 대조한다.
  exclude: 모델이나 운영자가 따로 불러야 대조하면 D03.11이다.
- id: D03.10
  name: 불일치 시 중단·경고
  include: 대조가 어긋나면 그 파생물을 쓰는 작업을 멈추거나 이후 응답·기록·보고서에 경고를 싣는다.
  exclude: 검증 도구 자신의 응답에 불일치를 표시하는 것만으로는 연결하지 않는다(D03.11).
- id: D03.11
  name: 검증 도구 제공
  include: 모델이나 운영자가 불러 파생물의 기준값 대조를 돌리는 도구·명령이 있다.
  exclude: 원본 증거를 검증하는 도구는 E02다. 서버가 쓰기 전에 스스로 대조하면 D03.09다.
