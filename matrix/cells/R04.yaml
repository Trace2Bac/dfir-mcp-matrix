# R04 해석 한계 안내
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: R04
name: 해석 한계 안내
question: 도구의 해석 제약과 결과가 증명하지 못하는 것, 추가 확인 필요성을 어떻게 알리는가?
conditional: false
boundary: 증거 속 지시를 따르지 말라는 안내는 R07
scope: 그 주의·추천이 붙는다고 구현에 적은 도구와 응답이다. 그 도구 안에서 주의가 빠지는 실행 경로가 있거나 응답이 잘려 주의가 보이지 않거나 주의가 결과와 맞지 않으면 †를 붙인다. 주의를 붙이지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 도구 설명·서버 지침·응답 어디에도 결과의 해석 한계나 추가 확인 필요성을 적지 않는다. 인자 사용법이나 호출 순서만 안내하는 경우도 여기에 둔다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: R04.01
  name: 도구별 정적 주의
  include: 도구 설명이나 그 도구의 응답에 결과와 관계없이 같은 문구로 해석 한계를 적는다.
  exclude: 인자 사용법·호출 순서 안내는 제외한다. 증거 속 지시를 따르지 말라는 안내는 R07이다.
- id: R04.02
  name: 결과 조건별 주의
  include: 결과의 내용·건수·종류에 따라 골라 붙이는 해석 주의를 응답에 싣는다.
  exclude: 조건 없이 늘 붙는 문구는 R04.01이다. 실패·부분 완료 같은 실행 상태 알림은 R03이다.
- id: R04.03
  name: 추가 확인 도구·증거 추천
  include: 결과를 확정하기 전에 확인할 다른 도구·증거·내용을 응답이나 도구 설명에서 권한다.
  exclude: 빠진 입력을 채우려고 먼저 돌릴 도구를 알리는 것은 R03, 다음 작업을 정해 주는 것은 P02에서 본다.
- id: R04.04
  name: 불확실성·추정 범위 표시
  include: 서버가 낸 판정·추정에 확신 수준·추정 범위·판단 보류를 값으로 싣는다.
  exclude: 모델이 발견사항에 적는 확신 수준은 D05에서 본다.
