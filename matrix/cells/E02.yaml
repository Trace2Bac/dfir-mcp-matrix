# E02 증거 무결성 검증
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: E02
name: 증거 무결성 검증
question: 어떤 바이트·범위를 언제 해시하고, 그 기준값과 현재 증거를 어떻게 대조해 차이를 처리하는가?
conditional: false
scope: 서버가 증거를 해시하거나 그 해시를 기준값과 대조한다고 구현에 적은 도구·경로다. 그 경로가 해시한다고 밝힌 증거 가운데 해시하지 않고 지나가는 것이 있거나, 해시·대조를 설정·인자로 끄거나, 해시 실패·불일치에도 그대로 진행하면 †를 붙인다. 해시하지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 서버가 증거 바이트의 해시를 계산하지 않는다. 증거 안에 적힌 해시 값(수집 도구 CSV의 해시 열 등)을 옮겨 싣기만 하는 경우도 여기에 둔다.
not_applicable: 서버가 파일·바이트로 받는 증거가 없다(살아 있는 시스템을 조회만 하는 서버 등).
details:
- id: E02.01
  name: 등록·첫 접근 시 자동 해시
  include: 증거를 등록하거나 처음 열 때 모델의 요청 없이 서버가 해시를 계산한다.
  exclude: 계산한 값을 기준값으로 보관하는지는 보고서에 적는다. 서버가 만든 파생물·사건 DB의 해시는 D03이다.
- id: E02.02
  name: 요청한 검증 도구에서 해시
  include: 모델이 해시·검증 도구를 부를 때만 해시를 계산한다. 서버가 외부 해시 도구를 실행하는 경우도 든다.
  exclude: 분석 도구가 결과에 덧붙이는 해시는 E02.04나 보고서에 적는다. 계산한 값을 기준값과 대조하면 E02.05~E02.07도 함께 본다.
- id: E02.03
  name: 전체 파일 해시
  include: 증거 파일 하나의 처음부터 끝까지 모든 바이트를 해시한다.
  exclude: EWF 같은 컨테이너 형식이면 컨테이너 파일의 해시인지 담긴 매체 데이터의 해시인지 보고서에 적는다. 분할 이미지에서 조각 하나만 해시하면 그 사실을 보고서에 적는다.
- id: E02.04
  name: 분할·논리 범위 해시
  include: 분할 이미지의 조각이나 이미지 안의 파일·파티션처럼 증거 파일 전체가 아닌 범위의 바이트를 따로 해시한다.
  exclude: 꺼낸 사본을 파생물로 보관하고 그 해시를 기록·대조하는 것은 D03이다.
- id: E02.05
  name: 전체 해시 재계산·대조
- id: E02.06
  name: 크기·수정 시각 대조
- id: E02.07
  name: 분석 전후 대조
- id: E02.08
  name: 불일치 시 중단·경고
