# P01 분석 방법 적합성 확인
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: P01
name: 분석 방법 적합성 확인
question: 무엇으로 증거 형식·OS·대상 환경을 정하고, 고른 분석 방법·프로필·참조 자료가 그 입력에 맞는지 어떻게 확인하는가?
conditional: false
boundary: 호출자가 준 유형을 대조 없이 받으면 미구현
scope: 서버가 증거 형식·OS·대상 영역을 판별하는 경로와, 그 판별로 방법을 고르거나 고른 방법을 대조한다고 구현에 적은 도구다. 같은 입력을 경로마다 다르게 판별하거나, 판별·대조가 그 도구의 일부 실행 경로에서 빠지거나, 판별 중 오류가 나면 알리지 않고 판별 없이 진행하면 †를 붙인다. 판별·대조가 없는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 서버가 증거 형식·OS를 판별하지 않고 호출자가 준 유형·방법을 대조 없이 받는다. 도구 설명으로 맞는 입력을 안내하기만 하는 경우도 여기에 둔다.
not_applicable: 없음. 모든 서버에 적용한다.
details:
- id: P01.01
  name: 이름·확장자 판별
  include: 파일 이름·확장자·폴더 이름으로 증거 형식이나 처리 경로를 정한다.
  exclude: 같은 판별에서 내용을 읽어 확인하면 P01.03에도 함께 연결한다.
- id: P01.02
  name: 메타데이터 조회
  include: 파일 크기·함께 있는 파일 같은 파일 속성이나, 분석 도구가 읽은 파티션 표·파일 시스템 정보를 조회해 형식·대상 영역을 정한다.
  exclude: 서버가 입력의 바이트를 직접 읽어 서명을 대조하면 P01.03이다.
- id: P01.03
  name: 내용·헤더 검사
  include: 서버가 입력의 바이트를 읽거나 형식 라이브러리로 열어 보아 서명·헤더·구조로 형식을 확인한다.
  exclude: 파일 위장 탐지처럼 형식 판별 자체가 분석 결과인 도구는 제외한다.
- id: P01.04
  name: 방법과 형식·OS 대조
  include: 고른 도구·플러그인·프로필이 판별한 형식·OS와 맞는지 대조하고 맞지 않으면 실행 결과로 쓰지 않거나 맞는 방법으로 돌린다.
  exclude: 실행이 실패한 뒤 오류 문구만으로 원인을 추정하면 제외한다. 실패 뒤라도 입력을 다시 판별해 대조하면 연결한다.
- id: P01.05
  name: 필수 입력 확인
  include: 고른 방법이 요구하는 부속 입력(심볼·규칙 파일·매핑 파일·하이브 유형 등)이 있는지 실행 전에 확인하고 없으면 실행하지 않거나 알린다.
  exclude: 이번 호출 인자의 형식·경로 검사는 T01, 앞선 호출이 만든 상태 확인은 T03에서 본다.
- id: P01.06
  name: 지원 카탈로그·검증 목록 대조
  include: 서버가 형식·OS별로 지원하는 방법 목록이나 검증한 조합 목록을 두고 고른 방법이 그 목록에 드는지 실행 전에 대조한다.
  exclude: 목록을 모델에게 보여 주기만 하면 P02.01이다. 실행 뒤 수행 여부를 대조하면 P03.01이다.
