# T07 도구 부재 처리
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: T07
name: 도구 부재 처리
question: 필요한 외부 도구·참조 자료가 있는지 실행 전에 확인하는가? 없거나 실패할 때 다른 프로그램·경로로 처리하는가? 그 사실과 결과 의미의 차이를 알리는가?
conditional: false
scope: 외부 도구(실행 파일·모듈·런타임)나 참조 자료(룰·맵·심볼)가 있어야 하는 호출이다. 구현에 적은 검사·알림·표시가 걸리는 도구에서 검사 없이 실행되는 경로, 참조 자료 일부를 쓸 수 없어도 알리지 않고 나머지로 실행하는 경로, 같은 도구를 다른 호출 경로(일괄·비동기 실행)로 부를 때 알림·표시가 빠지는 경우는 †를 붙인다. 검사·알림·표시가 없는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 외부 도구·참조 자료를 쓰는데 실행 전에 있는지 보지 않고, 없을 때 실행 오류를 가공 없이 넘기거나 성공처럼 돌려준다.
not_applicable: 서버가 자기 코드 밖의 도구·참조 자료를 쓰지 않는다.
details:
- id: T07.01
  name: 실행 전 도구·참조 자료 가용성 검사
  include: 실행 전에 실행 파일·모듈·런타임·참조 자료가 있는지(PATH 탐색, 파일 존재, import·시험 실행) 보고 없으면 실행하지 않는다.
  exclude: 입력 증거의 존재 검사는 T01이다. 버전이 맞는지 보는 것은 T05다. 부속 입력이 고른 방법·입력에 맞는지 대조하면 P01.04다.
- id: T07.02
  name: 대체 없는 실패 처리·도구 부재 알림
  include: 필요한 도구·참조 자료가 없으면 다른 경로로 바꾸지 않고 도구가 없다는 사실(오류 종류·설치 안내)을 응답에 알린다.
  exclude: 일반 실행 오류만 돌려주고 도구 부재를 가리지 않으면 제외한다.
- id: T07.03
  name: 등록·검증된 대체만 실행
  include: 원래 도구를 쓸 수 없을 때 미리 등록하고 검증한 대체 도구·경로만 실행하고 그 밖의 대체는 거부한다.
  exclude: 정해 둔 순서로 다른 경로를 시도하기만 하고 등록·검증이 없으면 T07.04·T07.06이다.
- id: T07.04
  name: 알림 없는 대체 실행
  include: 도구·경로·입력을 얻지 못하거나 실행이 실패하면 다른 프로그램·경로·입력으로 처리하고 대체 사실을 응답에 알리지 않는다. 출처 이름·추출기 이름이 달라 대체를 짐작할 수만 있어도 여기에 둔다.
  exclude: 대체 사실을 응답·기록 필드로 밝히면 T07.06이다. 실패와 관계없이 실행 환경에 따라 처음부터 경로를 고르면 T07.05다.
- id: T07.05
  name: 실행 환경별 경로 분기
  include: 설치 위치·런타임·OS·권한 같은 실행 환경에 따라 정해 둔 순서로 실행 파일·경로를 고른다.
  exclude: 앞 경로가 실패해서 다른 경로로 넘어가면 T07.04·T07.06이다. 고른 경로를 응답·기록에 밝히는지는 구현에 적는다.
- id: T07.06
  name: 대체 사실을 응답·기록에 표시
  include: 대체 프로그램·경로로 실행했다는 사실과 원래 경로를 응답·기록의 필드로 밝힌다.
  exclude: 대체로 달라진 결과의 뜻·검증·입력 범위까지 밝히면 T07.07에도 둔다. 서버 로그에만 남기면 T07.04다.
- id: T07.07
  name: 대체에 따른 검증·입력 범위 변화 표시
  include: 대체 경로로 바뀐 검증 수준·입력 범위·결과의 뜻(꺼낸 범위가 줄어듦, 다른 플러그인의 다른 의미)을 응답·기록에 밝힌다.
  exclude: 대체했다는 사실과 원래 경로만 밝히면 T07.06이다.
- id: T07.08
  name: 실행 전 부재 도구 자동 설치
  include: 도구·참조 자료를 처음 쓰기 전에 있는지 보고 없으면 정해 둔 출처(패키지 관리자, 내려받기 주소)에서 설치한 뒤 실행한다.
  exclude: 설치하는 버전의 고정·확인은 T05에서 본다. 없으면 실행하지 않고 멈추면 T07.01이다. 설치에 실패해도 응답에 알리지 않고 그대로 실행하면 †를 붙인다.
