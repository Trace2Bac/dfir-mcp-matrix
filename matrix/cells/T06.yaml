# T06 실행 환경정보 표시
# 셀 하나의 정의. 필드 뜻과 고치는 법은 matrix/README.md를 본다.

id: T06
name: 실행 환경정보 표시
question: 확인한 도구·환경의 판을 해당 결과와 기록에 어떻게 연결하는가?
conditional: false
boundary: 선언 판과 확인 판 가운데 무엇을 붙였는지 구분
scope: 판을 싣는다고 구현에 적은 결과·기록·파생물이다. 그 안에서 판이 빠지거나 잘려 보이지 않는 경로, 같은 도구를 다른 호출 경로(일괄·비동기 실행)로 부를 때 판이 빠지는 경우, 실행한 대상과 묶이지 않은 값을 싣는 경우는 †를 붙인다. 판을 싣지 않는 다른 도구는 †가 아니라 구현에 적는다.
not_implemented: 서버가 도구·참조 자료를 써서 결과를 내는데 응답·호출 기록·파생물 어디에도 판을 싣지 않는다.
not_applicable: 없음. 서버 자신의 판(T06.05)도 보므로 모든 서버에 적용한다.
details:
- id: T06.01
  name: 응답 메타데이터에 판 표시
  include: 분석 결과를 돌려주는 응답에 그 결과를 만든 도구·참조 자료의 판을 필드로 싣는다. 선언 판인지 실행에서 읽은 확인 판인지 구현에 적는다.
  exclude: 판을 알게 된 호출(설치·환경 조회)의 응답에만 있으면 T06.04다. 실행한 도구와 묶이지 않은 소스 상수는 세지 않는다. 도구가 출력 본문에 적은 버전 줄을 서버가 읽지 않고 본문째 넘기기만 하면 세지 않는다.
- id: T06.02
  name: 호출 기록 메타데이터에 판 표시
  include: 그 판으로 실행한 호출의 호출 기록 항목에 도구·참조 자료의 판을 싣는다.
  exclude: 판을 알게 된 호출(설치·환경 조회)의 기록에만 있으면 T06.04다. 호출과 이어지지 않는 별도 파일은 T06.03이다.
- id: T06.03
  name: 파생물 manifest에 판 표시
  include: 서버가 만든 파생물(출력 파일·사건 DB·보고서)의 manifest·메타데이터에 그 파생물을 만든 도구·참조 자료의 판을 적는다.
  exclude: 도구가 출력 본문에 적은 버전 줄이 파생물에 남기만 하면 세지 않는다. 판을 담을 자리만 있고 채우지 않으면 세지 않는다.
- id: T06.04
  name: 환경 조회 도구에서만 반환
  include: 환경·도구 상태를 묻는 별도 도구가 판을 돌려주고 분석 결과·기록에는 싣지 않는다.
  exclude: 분석 결과에도 실으면 T06.01·T06.02다.
- id: T06.05
  name: 서버 자신의 판 표시
  include: 서버 자신의 판(패키지 버전·git 커밋·코드 해시)을 응답·호출 기록·보고서에 싣는다.
  exclude: 명령 행 `--version`이나 시작 문구로만 보이면 세지 않는다.
- id: T06.06
  name: 모델·버전 표시
  include: 서버 안에서 모델을 부르면 그 모델 이름·판을 결과나 호출 기록에 싣는다.
  exclude: 서버가 모델을 부르지 않으면 이 상세를 보지 않는다. 모델 입력·응답 보존은 L02다.
