# 축 목록. 화면에는 이 차례대로 보인다. 셀 파일 이름의 첫 글자가 축 id다.
# 필드 뜻은 matrix/README.md를 본다.

axes:
- id: P
  name: 절차 관리
  english: Procedure management
  description: 에이전틱 DFIR이 조사 대상을 조사할 때 지켜야 하는 절차. 대상·방법 판별, 다음 작업 결정, 진행·완료 판단, 조사 단위·상태, 종료
- id: E
  name: 원본 증거 관리
  english: Evidence management
  description: 파생물이 아닌 원본 증거 데이터의 확보·등록·해시·보존·입력 준비
- id: T
  name: 도구 실행 통제
  english: Tool execution control
  description: 모델이 고른 도구 호출을 실행하기 전에 서버가 하는 입력 검증·허용 범위 제한·허가 조건 확인과, 실제 DFIR 도구를 실행하는 과정(실행 방식·격리, 도구 확인, 도구 부재·대체, 종료 처리). T01~T03은 실행 전 검사, T04~T09는 실행 과정, T10은 모델이 도구를 고르기 전에 보는 도구 명세
- id: R
  name: 실행 결과 전달
  english: Result delivery
  description: 실행 결과를 모델에게 돌려줄 때의 가공·잘림·상태와 한계·출처·민감정보·지시 구분
- id: L
  name: 서버 기록
  english: Logging
  description: 조사 과정을 다시 짜 맞추는 데 쓰는 서버 기록(도구 호출·외부 요청·상태 변경)의 범위·내용·보전
- id: D
  name: 파생물 관리
  english: Derivative management
  description: 진행 과정에서 나온 파생물(출력 파일·발견사항·보고서)의 관리. D01·D03·D04는 E축과 같은 짜임(보관 / 무결성 검증 / 쓰기 제한)이다
- id: I
  name: 외부 연동 통제
  english: Integration control
  description: 외부 API·서비스와 분석 도구의 통신에서 자료가 어디로 무엇이 나가는지와 서버 자격증명
