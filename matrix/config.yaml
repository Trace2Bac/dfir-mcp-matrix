# 도구 설정. 셀·상세 정의는 두지 않는다(matrix/cells/).
# servers: 화면에 보이는 서버. reports/<서버>/가 없거나 그 셀 파일이 없으면 그 셀에서 미확인(조사하지 않음)이고 조사한 서버 수에 들지 않는다.
# pilot_cells: 원고가 담아야 하는 셀. check가 reports/<서버>/<축>/<셀>.mdx가 모두 있는지 본다.
# version: 매트릭스 정의 버전. 셀 정의를 바꾼 날짜(YYYY-MM-DD)다. CONTRIBUTING.md의 「정의를 바꾸는 때와 버전」에 있다.

