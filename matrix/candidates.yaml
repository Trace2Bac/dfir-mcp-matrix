# 구현 사례가 아직 없는 상세 후보(결정 0043).
# 셀 정의(matrix/cells/)의 상세는 기준에 맞는 구현 사례(원고 연결이나 seen_in)가 있을 때만 둔다.
# 있을 법하지만 아직 사례가 없는 방식은 여기 셀별로 적어 둔다. 화면에는 보이지 않는다.
# 사례가 나오면 그 항목을 셀 파일의 details로 옮기고 여기서 지운다. 번호는 여기 적힌 번호를 그대로 쓴다.
# 새 상세나 새 후보의 번호는 셀 파일과 이 파일에서 아직 쓰지 않은 다음 번호다. 결정 기록이 지우거나 결번으로 정한 번호도 쓴 번호로 센다.

P03:
- id: P03.02
  name: 대상별 시도·성공·실패·생략 집계
  include: 서버가 증거 항목이나 시스템마다 시도, 성공, 실패, 생략한 작업을 여러 호출의 호출 기록이나 작업 상태로 집계해 알려 주면 해당합니다.
  exclude: 대상을 구별하지 않고 작업 묶음의 실행 상태만 집계하는 경우는 해당하지 않습니다.

T02:
- id: T02.01
  name: 설정으로 도구 끄기
  include: 사용자가 서버 시작 설정(실행 인자, 환경변수, 설정 파일)으로 도구나 작업을 끄는 경우입니다.

T03:
- id: T03.10
  name: 앞단 게이트웨이 인증에 위임
  include: 서버는 호출자를 확인하지 않고 저장소가 지원하는 배포 구성의 앞단 프록시나 게이트웨이 인증에 맡기는 경우입니다.
  exclude: 그런 배포 구성이 저장소에 없으면 해당하지 않습니다.

T04:
- id: T04.06
  name: 시스템 접근 제한
  include: 서버가 운영체제 기능(seccomp, namespace, Landlock 등)으로 외부 도구 프로세스의 파일, 네트워크, 시스템
    호출 접근을 막는 경우입니다.
  exclude: 외부 도구 자체의 명령 제한 설정은 해당하지 않습니다.
- id: T04.07
  name: 컨테이너·VM
  include: 서버가 외부 도구를 서버와 분리된 컨테이너나 VM에서 실행하는 경우입니다.
  exclude: 서버와 도구가 한 컨테이너 안에서 같은 계정으로 실행되는 경우는 T04.02에서 봅니다.

T05:
- id: T05.05
  name: 사용 전 기대값 대조
  include: 서버가 도구나 참조 자료를 쓰기 직전에 기대값(해시, 파일 목록, 식별값)과 대조해 다르면 실행하지 않는 경우입니다.
  exclude: 설치할 때만 대조하는 경우는 T05.01에서 봅니다. 값을 계산하거나 읽기만 하고 대조하지 않는 경우와 형식 검사로 쓸 수 있는 파일만 고르는 경우는 해당하지 않습니다.
- id: T05.06
  name: 서명 검사
  include: 서버가 도구나 참조 자료를 쓰기 전에 배포자의 서명(코드 서명, GPG, sigstore)을 검사하고 맞지 않으면 실행하지 않는 경우입니다.
  exclude: 설치할 때 패키지 관리자가 하는 서명 검사만 있는 경우는 T05.01에서 봅니다.

T06:
- id: T06.03
  name: 파생물 manifest에 버전 표시
  include: 서버가 만든 파생물(출력 파일, 사건 DB, 보고서)의 manifest나 메타데이터에 그 파생물을 만든 도구와 참조 자료의 버전을
    적으면 해당합니다.
  exclude: 도구가 출력 본문에 적은 버전 줄이 파생물에 남기만 하는 경우는 해당하지 않습니다. 버전을 담을 자리만 있고 채우지 않는 경우도
    해당하지 않습니다.

T07:
- id: T07.03
  name: 등록·검증된 대체만 실행
  include: 원래 도구를 쓸 수 없을 때, 서버가 미리 등록하고 검증한 대체 도구나 경로만 실행하고 그 밖의 대체는 거부하는 경우입니다.
  exclude: 정해 둔 순서로 다른 경로를 시도하기만 하고 등록이나 검증이 없는 경우는 해당하지 않습니다.

R01:
- id: R01.04
  name: 모델 요약
  include: 서버가 모델을 불러 도구 출력을 줄이거나 다시 서술한 글을 응답하는 경우입니다. 입력에 없던 관계나 평가를 더하지 않습니다.

- id: R01.12
  name: 응답 선별 사실·건수 표시
  include: 서버 규칙으로 응답 항목을 골랐을 때 뺀 건수나 적용한 규칙을 응답에 싣는 경우입니다.
  exclude: 고른 뒤의 건수만 싣는 경우는 해당하지 않습니다.

R02:
- id: R02.09
  name: 누적 출력량 집계·알림
  include: 서버가 세션이나 사건 단위로 모델에게 돌려준 출력량을 집계해 정한 값을 넘으면 알리거나 거부하는 경우입니다.
  exclude: 응답 하나의 크기만 제한하는 경우는 R02.01에서 봅니다.

R07:
- id: R07.03
  name: 경계 태그 표시
  include: 증거에서 온 값을 표시 문자열로 감싸 서버 문구와 구분하는 경우입니다.
  exclude: 서버 문구까지 모두 감싸서 구분이 없는 경우는 해당하지 않습니다. 여는 머리말만 있고 닫는 표시가 없는 경우도 해당하지 않습니다.
- id: R07.06
  name: 지시 문구 필터링·차단
  include: 서버가 지시로 보이는 문구를 지우거나 그런 결과를 막는 경우입니다.
  exclude: 표시하거나 안내하기만 하는 경우는 해당하지 않습니다.

R08:
- id: R08.04
  name: 시간 변환·추정 사실 표시
  include: 서버가 바꾸거나 추정해 채운 시각이라는 사실을 응답의 필드, 값, 문구로 알리는 경우입니다. 연도나 시간대를 가정해 채운 경우가 그 예입니다.
  exclude: 바꾼 값을 따로 두기만 하고 무엇을 가정했는지 알리지 않는 경우는 해당하지 않습니다.
- id: R08.05
  name: 출처 간 시계 오차 추정·반영 표시
  include: 서버가 출처마다 시계 오차를 추정하고 그 값을 시각에 반영하거나 함께 표시하는 경우입니다.
  exclude: 시간대를 정규화하기만 하는 경우는 해당하지 않습니다.

L03:
- id: L03.01
  name: 실행 전 중단
  include: 서버가 실행 전에 요청 항목을 쓰고 그 쓰기가 실패하면 도구를 실행하지 않고 오류를 돌려주는 경우입니다.

L04:
- id: L04.02
  name: 서명·MAC
  include: 항목이나 해시 체인의 끝 값에 키로 서명이나 MAC을 붙여 키가 없는 쪽이 고친 항목을 알아볼 수 있게 하는 경우입니다.
- id: L04.05
  name: 쓰기 권한 분리·추가 전용 저장
  include: 서버 프로세스나 모델 도구가 고칠 수 없는 권한이나 저장소에 기록을 두는 경우입니다. 추가 전용 속성, 별도 계정, 덮어쓸 수
    없는 저장소가 그 예입니다.
  exclude: 파일을 덧붙이기 모드로 여는 것만으로는 해당하지 않습니다.

D01:
- id: D01.05
  name: 보관 기간·대상 정책
  include: 보관 기간, 보관하는 자료 전체의 크기나 개수 상한, 보관 대상을 정하는 설정이나 코드가 있고 서버가 그에 따라 무엇을 얼마나 남길지
    정하는 경우입니다.
  exclude: 정책 없이 도구마다 일부만 남기는 경우는 해당하지 않습니다.

D02:
- id: D02.04
  name: 양방향 추적 조회
  include: 양방향으로 찾는 조회 도구나 명령이 있는 경우입니다. 파생물에서 그것을 만든 호출과 입력을 찾을 수 있고 반대로 호출이나 입력에서
    그것이 만든 파생물도 찾을 수 있어야 합니다.
  exclude: 한 방향의 참조 필드만 있는 경우와 정의만 있고 도구나 명령에서 부르지 않는 함수는 해당하지 않습니다.

D03:
- id: D03.02
  name: 도구를 요청해 기준값 계산
  include: 모델이나 사용자가 고른 파생물의 해시를 계산해 돌려주는 도구나 명령이 있는 경우입니다.
  exclude: 증거와 파생물을 가리지 않는 범용 해시 도구는, 파생물 경로도 받는다는 이유만으로 이 상세에 연결하지 않습니다.

F02:
- id: F02.09
  name: 판정 제외 조건의 공개
  include: 판정 규칙이 분석 대상이나 의심 후보에서 뺀 항목의 수나 기준을 결과에 싣는 경우입니다.
  exclude: 뺀 항목을 포함한 전체 목록을 따로 돌려줄 뿐 뺀 사실을 밝히지 않는 경우는 해당하지 않습니다.
- id: F02.10
  name: 판정 제외 대상·사유 기록
  include: 판정 규칙이 분석 대상이나 의심 후보에서 뺀 항목마다 대상 식별자와 뺀 사유나 규칙을 결과나 서버 기록에 남기는 경우입니다.
  exclude: 뺀 건수나 기준만 싣는 경우는 F02.09에서 봅니다.

F03:
- id: F03.04
  name: 모델 입력 전체 한계 확인·중단
  include: 서버가 처리 중 부르는 모델에게 보낼 입력 전체의 크기를 그 모델의 문맥 한계와 비교해, 넘으면 호출을 멈추거나 거부하고 그 사실을 응답이나 기록에 남기는 경우입니다.
  exclude: 입력 조각마다 줄 수나 글자 수 상한을 두는 것은 F03.03에서 봅니다.

F05:
- id: F05.06
  name: 사람 검토
  include: 사람 검토자의 승인이나 반려 기록이 있어야만 서버가 발견사항을 확정하거나 보고 산출물에 싣는 경우입니다.
  exclude: 보고서를 사람이 읽는다는 사실만으로는 해당하지 않습니다. 승인 기록으로 호출 자체를 막는 장치도 해당하지 않습니다.

D09:
- id: D09.02
  name: 재시도·대체 저장
  include: 저장이 실패하면 다시 쓰거나 다른 위치나 형식으로 남기고 그 사실을 응답이나 기록에 남기는 경우입니다.
  exclude: 실패한 부분을 빼고 나머지만 쓰는 경우는 D09.01에서 봅니다.

I01:
- id: I01.07
  name: 호출자가 목적지 지정
  include: 모델이 호출 인자로 접속할 호스트나 URL을 정하는 경우입니다.
  exclude: 등록한 이름으로만 고르면 I01.04에서 봅니다.
- id: I01.08
  name: 동적 탐색
  include: 서버가 실행 중에 접속 대상을 찾아내는 경우입니다. 서비스 탐색, 응답에 들어 있는 다음 주소, 클러스터 노드 목록 등을 쓰는 방식이
    그 예입니다.
  exclude: 설정에 적은 목록을 차례로 쓰는 경우는 I01.06에서 봅니다.

I02:
- id: I02.01
  name: 네트워크 차단
  include: 서버 코드나 저장소가 지원하는 실행 구성이 분석 도구 프로세스의 네트워크를 끊는 경우입니다. 컨테이너 `--network none`,
    network namespace, 방화벽 규칙이 그 예입니다.
  exclude: 문서가 권하기만 하고 서버 코드나 배포 구성에 없는 경우는 해당하지 않습니다.
- id: I02.04
  name: 프록시·목적지 제한
  include: 환경변수나 설정으로, 분석 도구 프로세스의 통신이 프록시나 허용한 목적지로만 나가도록 묶는 경우입니다.

I03:
- id: I03.05
  name: 민감 값 빼기·가림 후 전송
  include: 보내기 전에 서버가 민감한 값(내부 주소, 사용자 이름 등)을 빼거나 가리는 경우입니다.
  exclude: 값의 형식만 검사해 형식이 다른 값을 보내지 않는 것은 해당하지 않습니다.

I04:
- id: I04.02
  name: 실행 시 주입
  include: 비밀 관리 도구(vault, keyring, 컨테이너 secret)나 클라이언트가 실행할 때 자격증명을 넣어 주고 서버 설정에는 값을
    두지 않는 경우입니다.
  exclude: 사용자가 미리 설정한 환경변수를 읽기만 하는 경우는 I04.01에서 봅니다.
- id: I04.03
  name: 설정 파일 권한 검사
  include: 자격증명을 담은 파일의 소유자와 권한을 서버가 검사하고 권한이 너무 넓으면 경고하거나 거부하는 경우입니다.
  exclude: 문서가 권한 설정을 권하기만 하는 경우는 해당하지 않습니다.
- id: I04.05
  name: 응답·기록·오류에서 비밀값 제거
  include: 응답, 호출 기록, 로그, 오류 문구에서 자격증명 값을 찾아 지우거나 가리는 경우입니다.
  exclude: 자격증명을 처음부터 응답이나 기록에 넣지 않는 것은 해당하지 않습니다.
- id: I04.06
  name: 권한·수명 제한
  include: 서버가 쓰는 자격증명의 권한 범위(읽기 전용 등)나 유효 기간을 서버 코드나 저장소의 구성이 좁히는 경우입니다.
  exclude: 문서가 좁은 권한을 권하기만 하는 경우는 해당하지 않습니다.
